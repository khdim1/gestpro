<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Boutique en ligne</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- ColorThief pour extraction des couleurs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.min.js"></script>

    <style>
        /* ============================================================
               VARIABLES CSS (dynamiques)
            ============================================================ */
        :root {
            /* Couleurs primaires (seront écrasées par celles du logo) */
            --primary: #2c6e9e;
            --primary-dark: #1a4a6e;
            --primary-light: #e8f0fe;
            --secondary: #27ae60;

            /* Thème clair */
            --bg-body: #f5f7fb;
            --bg-card: #ffffff;
            --text-color: #1a2a3a;
            --text-muted: #6b7a8a;
            --border-color: rgba(0,0,0,0.08);
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 12px 40px rgba(0,0,0,0.12);
            --card-border: 1px solid rgba(0,0,0,0.04);
        }

        /* Thème sombre */
        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-color: #e8e8e8;
            --text-muted: #a0a0a0;
            --border-color: rgba(255,255,255,0.08);
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-hover: 0 12px 40px rgba(0,0,0,0.6);
            --card-border: 1px solid rgba(255,255,255,0.06);
        }

        /* ============================================================
               STYLES GÉNÉRAUX
            ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            padding-bottom: 20px;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar-custom {
            background: var(--bg-card);
            box-shadow: 0 2px 16px rgba(0,0,0,0.04);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1050;
            transition: background 0.3s, box-shadow 0.3s;
            border-bottom: var(--card-border);
        }
        .navbar-custom .brand {
            font-weight: 800;
            font-size: 1.9rem;
            color: var(--primary);
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .navbar-custom .brand i {
            margin-right: 6px;
        }
        .navbar-custom .cart-btn {
            position: relative;
            background: var(--primary-light);
            border: none;
            border-radius: 50px;
            padding: 6px 16px;
            font-weight: 600;
            color: var(--primary);
            transition: all 0.25s ease;
            font-size: 0.9rem;
        }
        .navbar-custom .cart-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.04);
        }
        .navbar-custom .cart-btn .badge-cart {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        /* Toggle thème */
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 4px 12px;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
        }
        .theme-toggle:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .theme-toggle .icon {
            transition: transform 0.4s;
        }
        [data-theme="dark"] .theme-toggle .icon {
            transform: rotate(180deg);
        }

        /* Hero */
        .hero-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 30px 0 20px;
            margin-bottom: 24px;
            color: white;
            text-align: center;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transition: background 0.3s;
        }
        .hero-section h1 {
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }
        .hero-section p {
            opacity: 0.9;
            font-size: 1rem;
            margin-top: 2px;
        }

        /* Search */
        .search-wrapper {
            background: var(--bg-card);
            border-radius: 60px;
            padding: 4px;
            box-shadow: var(--shadow);
            max-width: 500px;
            margin: 0 auto 16px;
            transition: background 0.3s, box-shadow 0.3s;
            border: var(--card-border);
        }
        .search-wrapper input {
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            background: transparent;
            font-size: 0.95rem;
            width: 100%;
            color: var(--text-color);
        }
        .search-wrapper input::placeholder {
            color: var(--text-muted);
        }
        .search-wrapper input:focus {
            outline: none;
            box-shadow: none;
        }
        .search-wrapper button {
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 60px;
            padding: 8px 22px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.25s;
        }
        .search-wrapper button:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        /* Contact info */
        .contact-info {
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: background 0.3s, box-shadow 0.3s;
            border: var(--card-border);
            border-left-width: 4px;
        }
        .contact-info i {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
            color: var(--primary);
        }

        /* Grille produits en mode masonry */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }
        .product-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: var(--card-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 320px;
            position: relative;
            animation: fadeInUp 0.5s ease both;
        }
        .product-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .product-card .product-img {
            position: relative;
            height: 180px;
            background: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
            cursor: crosshair;
            transition: background 0.3s;
        }
        .product-card .product-img img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }
        .product-card .product-img i {
            font-size: 3rem;
            color: var(--text-muted);
        }

        /* Lentille de zoom */
        .zoom-lens {
            position: absolute;
            border: 2px solid var(--primary);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            background-repeat: no-repeat;
            pointer-events: none;
            display: none;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            background-color: rgba(255,255,255,0.1);
        }
        .product-img:hover .zoom-lens {
            display: block;
        }

        .product-card .card-body {
            padding: 12px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .product-card .card-body .product-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
            color: var(--text-color);
        }
        .product-card .card-body .product-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .product-card .card-body .product-price {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
            transition: color 0.3s;
        }
        .product-card .card-body .product-stock {
            font-size: 0.7rem;
            font-weight: 600;
        }
        .product-card .card-body .product-stock.in-stock {
            color: var(--secondary);
        }
        .product-card .card-body .product-stock.low-stock {
            color: #f39c12;
        }
        .product-card .card-body .product-stock.out-of-stock {
            color: #e74c3c;
        }
        .product-card .card-body .btn-add {
            margin-top: 8px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.25s;
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 0;
            width: 100%;
            cursor: pointer;
        }
        .product-card .card-body .btn-add:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }
        .product-card .card-body .btn-add:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }
        .wholesale-badge {
            background: #8e44ad;
            color: white;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
            align-self: flex-start;
        }

        /* Animation d’entrée */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card:nth-child(1) { animation-delay: 0.02s; }
        .product-card:nth-child(2) { animation-delay: 0.04s; }
        .product-card:nth-child(3) { animation-delay: 0.06s; }
        .product-card:nth-child(4) { animation-delay: 0.08s; }
        .product-card:nth-child(5) { animation-delay: 0.10s; }
        .product-card:nth-child(6) { animation-delay: 0.12s; }

        /* Scroll sentinel */
        #scroll-sentinel {
            height: 20px;
            margin: 20px 0;
            text-align: center;
            color: var(--text-muted);
        }
        #scroll-sentinel .spinner {
            display: none;
            width: 2rem;
            height: 2rem;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            background: var(--bg-card);
            border-top: var(--card-border);
            padding: 16px 0;
            margin-top: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            transition: background 0.3s, border 0.3s;
        }

        /* Toast */
        .toast-container {
            z-index: 9999;
        }

        /* ============================================================
               PANIER CENTRÉ (Modal amélioré)
            ============================================================ */
        #cartOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1055;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }
        #cartOverlay.visible {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #cartModal {
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: var(--shadow-hover);
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            padding: 20px 18px 16px;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
            border: var(--card-border);
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #cartModal .cart-header-modal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-light);
            margin-bottom: 12px;
        }
        #cartModal .cart-header-modal .close-cart {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        #cartModal .cart-header-modal .close-cart:hover {
            color: #e74c3c;
            transform: scale(1.1);
        }
        #cartModal .cart-items-list {
            flex: 1;
            overflow-y: auto;
            max-height: 45vh;
            padding-right: 4px;
            margin-bottom: 10px;
        }
        #cartModal .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        #cartModal .cart-item-row .item-name {
            flex: 1;
            font-weight: 500;
        }
        #cartModal .cart-item-row .item-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 10px;
        }
        #cartModal .cart-item-row .item-qty button {
            border: none;
            background: var(--border-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-weight: 700;
            transition: all 0.2s;
            color: var(--text-color);
        }
        #cartModal .cart-item-row .item-qty button:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        #cartModal .cart-item-row .item-price {
            font-weight: 700;
            color: var(--primary);
            min-width: 70px;
            text-align: right;
        }
        #cartModal .cart-item-row .item-remove {
            color: #e74c3c;
            cursor: pointer;
            font-size: 1.1rem;
            margin-left: 6px;
            transition: transform 0.2s;
        }
        #cartModal .cart-item-row .item-remove:hover {
            transform: scale(1.2);
        }
        #cartModal .cart-total-modal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid var(--border-color);
            padding-top: 12px;
            margin-top: 4px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        #cartModal .cart-total-modal .total-amount {
            color: var(--primary);
            font-size: 1.3rem;
        }
        #cartModal .cart-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
        }
        #cartModal .btn-clear-cart {
            background: transparent;
            border: none;
            color: #e74c3c;
            font-size: 0.85rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 6px 12px;
        }
        #cartModal .btn-checkout-modal {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.25s;
        }
        #cartModal .btn-checkout-modal:hover {
            transform: scale(1.04);
            opacity: 0.9;
        }
        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .product-card .product-img {
                height: 140px;
            }
            .navbar-custom .brand {
                font-size: 1.4rem;
            }
            .hero-section h1 {
                font-size: 1.5rem;
            }
            .theme-toggle span {
                display: none;
            }
            .theme-toggle {
                padding: 4px 10px;
            }
            #cartModal {
                width: 95%;
                max-height: 90vh;
            }
        }
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .product-card .product-img {
                height: 120px;
            }
            .product-card .card-body .product-name {
                font-size: 0.8rem;
            }
            .product-card .card-body .product-price {
                font-size: 1rem;
            }
        }

        /* Fly to cart animation */
        .fly-item {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 9999;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 1;
        }
        .fly-item.hide {
            opacity: 0;
            transform: scale(0.5);
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-custom">
    <div class="container-fluid px-3">
        <div class="d-flex align-items-center flex-wrap">
            <div class="logo-container me-3"></div>
            <a href="#" class="brand" id="shopBrand"><i class="bi bi-bag"></i> Boutique</a>
        </div>
        <div class="d-flex align-items-center">
            <button class="theme-toggle" id="themeToggle" aria-label="Basculer le thème">
                <span class="icon">🌙</span>
                <span>Thème</span>
            </button>
            <button class="cart-btn ms-2" onclick="openCart()">
                <i class="bi bi-cart"></i> Panier
                <span class="badge-cart" id="cartCount">0</span>
            </button>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero-section">
    <div class="container-fluid">
        <h1 id="shopName">Bienvenue dans notre boutique</h1>
        <p id="shopSubtitle">Découvrez nos produits de qualité</p>
    </div>
</section>

<!-- Contenu principal -->
<div class="container-fluid px-3">
    <div class="search-wrapper d-flex align-items-center">
        <input type="text" id="searchInput" placeholder="🔍 Rechercher un produit..." oninput="filterProducts()">
        <button onclick="filterProducts()"><i class="bi bi-search"></i></button>
    </div>

    <div class="contact-info" id="contactInfo">
        <div class="row g-3 align-items-center">
            <div class="col-md-4">
                <i class="bi bi-geo-alt me-2"></i>
                <span id="shopAddress">Adresse non renseignée</span>
            </div>
            <div class="col-md-3">
                <i class="bi bi-telephone me-2"></i>
                <span id="shopPhone">Tél non renseigné</span>
            </div>
            <div class="col-md-3">
                <i class="bi bi-envelope me-2"></i>
                <span id="shopEmail">Email non renseigné</span>
            </div>
            <div class="col-md-2">
                <i class="bi bi-clock me-2"></i>
                <span id="shopHours">Lun-Sam 8h-20h</span>
            </div>
        </div>
    </div>

    <!-- Grille produits (masonry) -->
    <div class="product-grid" id="productGrid"></div>

    <!-- Sentinelle pour chargement infini -->
    <div id="scroll-sentinel">
        <div class="spinner" id="loadingSpinner"></div>
        <span id="sentinelText">Charger plus de produits…</span>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <div class="container-fluid">
        <p class="mb-0" id="footerText">© 2026 GestPro – Boutique en ligne</p>
    </div>
</div>

<!-- Panier centré (Modal) -->
<div id="cartOverlay" onclick="if(event.target===this) closeCart()">
    <div id="cartModal">
        <div class="cart-header-modal">
            <span><i class="bi bi-cart"></i> Mon panier</span>
            <button class="close-cart" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-items-list" id="cartItemsList"></div>
        <div class="cart-total-modal">
            <span>Total :</span>
            <span class="total-amount" id="cartTotalModal">0 FCFA</span>
        </div>
        <div class="cart-actions">
            <button class="btn-clear-cart" onclick="clearCart()">Vider</button>
            <button class="btn-checkout-modal" onclick="showCheckout()">Passer commande</button>
        </div>
    </div>
</div>

<!-- Modal Checkout -->
<div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="background: var(--bg-card); color: var(--text-color); border: var(--card-border);">
            <div class="modal-header" style="border-bottom-color: var(--border-color);">
                <h5 class="modal-title"><i class="bi bi-person"></i> Informations de livraison</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" style="filter: var(--btn-close-filter);"></button>
            </div>
            <div class="modal-body">
                <form id="checkoutForm">
                    <div class="mb-3"><label class="form-label">Nom complet *</label><input type="text" id="customerName" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" id="customerEmail" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Téléphone</label><input type="text" id="customerPhone" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Adresse de livraison</label><textarea id="customerAddress" class="form-control" rows="2"></textarea></div>
                    <div class="mb-3"><label class="form-label">Mode de paiement</label>
                        <select id="paymentMethod" class="form-select">
                            <option value="cash">Espèces à la livraison</option>
                            <option value="wave">Wave</option>
                            <option value="orange">Orange Money</option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label">Notes</label><textarea id="orderNotes" class="form-control" rows="2"></textarea></div>
                </form>
            </div>
            <div class="modal-footer" style="border-top-color: var(--border-color);">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button class="btn btn-primary" onclick="placeOrder()" style="background:var(--primary);border-color:var(--primary);">
                    <i class="bi bi-check-circle"></i> Confirmer
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert">
        <div class="toast-header" style="background: var(--bg-card); color: var(--text-color); border-bottom-color: var(--border-color);">
            <strong class="me-auto"><i class="bi bi-bell"></i> Notification</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" style="filter: var(--btn-close-filter);"></button>
        </div>
        <div class="toast-body" id="toastBody" style="background: var(--bg-card); color: var(--text-color);">Message</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ================================================================
    //  THÈME (Mode sombre)
    // ================================================================
    (function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeUI(savedTheme);
    })();

    function updateThemeUI(theme) {
        const toggle = document.getElementById('themeToggle');
        const icon = toggle.querySelector('.icon');
        const label = toggle.querySelector('span:last-child');
        if (theme === 'dark') {
            icon.textContent = '☀️';
            label.textContent = 'Clair';
        } else {
            icon.textContent = '🌙';
            label.textContent = 'Thème';
        }
        // Ajuster le filtre du bouton de fermeture (pour Bootstrap)
        const closeBtns = document.querySelectorAll('.btn-close');
        closeBtns.forEach(btn => {
            btn.style.filter = theme === 'dark' ? 'invert(1)' : 'none';
        });
    }

    document.getElementById('themeToggle').addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeUI(next);
    });

    // ================================================================
    //  GLOBAL
    // ================================================================
    let allProducts = [];
    let cart = [];
    let currentPage = 0;
    let loading = false;
    let hasMore = true;
    const itemsPerPage = 24;
    let shopSettings = null;
    let filteredProducts = [];
    let shopId = '';
    let totalProducts = 0;

    // ================================================================
    //  CHARGEMENT DES PARAMÈTRES
    // ================================================================
    async function loadShopSettings(shopId) {
        if (!shopId) return;
        try {
            const res = await fetch(`/api/public/settings?shop=${shopId}`);
            if (res.ok) {
                shopSettings = await res.json();
                if (shopSettings.company_name) {
                    document.getElementById('shopName').textContent = shopSettings.company_name;
                    document.getElementById('shopBrand').textContent = shopSettings.company_name;
                    document.title = shopSettings.company_name + ' | Boutique';
                    document.getElementById('footerText').textContent =
                        `© ${new Date().getFullYear()} ${shopSettings.company_name} – Boutique en ligne`;
                }
                if (shopSettings.company_subtitle) {
                    document.getElementById('shopSubtitle').textContent = shopSettings.company_subtitle;
                }
                document.getElementById('shopAddress').textContent = shopSettings.company_address || 'Adresse non renseignée';
                const phone = shopSettings.company_phone || '';
                const phone2 = shopSettings.company_phone2 || '';
                document.getElementById('shopPhone').textContent = phone + (phone2 ? ' / ' + phone2 : '') || 'Tél non renseigné';
                document.getElementById('shopEmail').textContent = shopSettings.company_email || 'Email non renseigné';

                const logoContainer = document.querySelector('.logo-container');
                if (shopSettings.logo_url && shopSettings.logo_url.trim() !== '') {
                    const img = document.createElement('img');
                    img.src = shopSettings.logo_url;
                    img.alt = 'Logo';
                    img.style.maxHeight = '200px';
                    img.style.width = 'auto';
                    img.style.display = 'block';
                    img.crossOrigin = 'anonymous';
                    logoContainer.innerHTML = '';
                    logoContainer.appendChild(img);
                    img.onload = function() { extractColorsFromLogo(img); };
                    img.onerror = function() { if (shopSettings.primary_color) applyPrimaryColor(shopSettings.primary_color); };
                } else {
                    logoContainer.innerHTML = '';
                    if (shopSettings.primary_color) applyPrimaryColor(shopSettings.primary_color);
                }
                if (shopSettings.primary_color) window._fallbackPrimary = shopSettings.primary_color;
            }
        } catch (err) { console.error('Erreur chargement paramètres:', err); }
    }

    // ================================================================
    //  EXTRACTION DES COULEURS
    // ================================================================
    function extractColorsFromLogo(imgElement) {
        try {
            const colorThief = new ColorThief();
            const palette = colorThief.getPalette(imgElement, 2);
            if (palette && palette.length >= 2) {
                const primaryHex = rgbToHex(palette[0][0], palette[0][1], palette[0][2]);
                const secondaryHex = rgbToHex(palette[1][0], palette[1][1], palette[1][2]);
                applyColors(primaryHex, secondaryHex);
            } else if (palette && palette.length === 1) {
                const primaryHex = rgbToHex(palette[0][0], palette[0][1], palette[0][2]);
                applyColors(primaryHex, primaryHex);
            } else if (window._fallbackPrimary) applyPrimaryColor(window._fallbackPrimary);
        } catch (err) { if (window._fallbackPrimary) applyPrimaryColor(window._fallbackPrimary); }
    }

    function applyColors(primaryHex, secondaryHex) {
        applyPrimaryColor(primaryHex);
        if (secondaryHex) document.documentElement.style.setProperty('--secondary', secondaryHex);
    }

    function applyPrimaryColor(hex) {
        if (!hex || !/^#?([a-f0-9]{6}|[a-f0-9]{3})$/i.test(hex)) return;
        if (!hex.startsWith('#')) hex = '#' + hex;
        document.documentElement.style.setProperty('--primary', hex);
        const darker = darkenColor(hex, 30);
        const lighter = lightenColor(hex, 40);
        document.documentElement.style.setProperty('--primary-dark', darker);
        document.documentElement.style.setProperty('--primary-light', lighter);
        document.querySelectorAll('.text-primary').forEach(el => el.style.color = hex);
        document.querySelectorAll('.border-primary').forEach(el => el.style.borderColor = hex);
        document.querySelectorAll('.btn-primary').forEach(el => { el.style.backgroundColor = hex; el.style.borderColor = hex; });
    }

    function darkenColor(hex, amount) { let c = hexToRgb(hex); if (!c) return '#1a4a6e'; let r = Math.max(0, c.r - amount), g = Math.max(0, c.g - amount), b = Math.max(0, c.b - amount); return rgbToHex(r, g, b); }
    function lightenColor(hex, amount) { let c = hexToRgb(hex); if (!c) return '#e8f0fe'; let r = Math.min(255, c.r + amount), g = Math.min(255, c.g + amount), b = Math.min(255, c.b + amount); return rgbToHex(r, g, b); }
    function hexToRgb(hex) { hex = hex.replace(/^#/, ''); if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2]; const result = /^([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); return result ? { r: parseInt(result[1],16), g: parseInt(result[2],16), b: parseInt(result[3],16) } : null; }
    function rgbToHex(r, g, b) { return '#' + [r,g,b].map(x => Math.round(x).toString(16).padStart(2,'0')).join(''); }

    // ================================================================
    //  CHARGEMENT DES PRODUITS
    // ================================================================
    async function loadAllProducts() {
        try {
            const url = `/api/public/products?shop=${shopId}&limit=9999`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            allProducts = data.products || data || [];
            totalProducts = data.total || allProducts.length;
            console.log(`✅ ${allProducts.length} produits chargés`);
        } catch (err) { console.error('Erreur chargement produits:', err); showToast('Erreur chargement produits: ' + err.message, 'danger'); }
    }

    // ================================================================
    //  FILTRE ET PAGINATION
    // ================================================================
    function applyFilterAndReset() {
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        filteredProducts = allProducts.filter(p => p.name.toLowerCase().includes(search) || (p.barcode && p.barcode.toLowerCase().includes(search)));
        currentPage = 0;
        document.getElementById('productGrid').innerHTML = '';
        document.getElementById('sentinelText').textContent = 'Charger plus de produits…';
        document.getElementById('loadingSpinner').style.display = 'none';
        loadMoreProducts();
    }
    window.filterProducts = function() { applyFilterAndReset(); };

    function loadMoreProducts() {
        if (loading || !hasMore) return;
        if (currentPage * itemsPerPage >= filteredProducts.length) {
            hasMore = false;
            document.getElementById('sentinelText').textContent = '— Tous les produits sont chargés —';
            document.getElementById('loadingSpinner').style.display = 'none';
            return;
        }
        loading = true;
        const spinner = document.getElementById('loadingSpinner');
        const sentinelText = document.getElementById('sentinelText');
        spinner.style.display = 'block';
        sentinelText.textContent = 'Chargement en cours…';
        setTimeout(() => {
            const start = currentPage * itemsPerPage;
            const end = Math.min(start + itemsPerPage, filteredProducts.length);
            const pageItems = filteredProducts.slice(start, end);
            currentPage++;
            renderProductItems(pageItems);
            if (end >= filteredProducts.length) { hasMore = false; sentinelText.textContent = '— Tous les produits sont chargés —'; } else { sentinelText.textContent = 'Charger plus de produits…'; }
            spinner.style.display = 'none';
            loading = false;
        }, 150);
    }

    // ================================================================
    //  AFFICHAGE DES PRODUITS (avec masonry + zoom)
    // ================================================================
    function renderProductItems(items) {
        const grid = document.getElementById('productGrid');
        const currency = shopSettings?.currency || 'FCFA';
        const fragment = document.createDocumentFragment();

        items.forEach((p, index) => {
            const stockStatus = p.quantity <= 0 ? 'out-of-stock' : (p.quantity <= 5 ? 'low-stock' : 'in-stock');
            const stockLabel = p.quantity <= 0 ? 'Rupture' : (p.quantity <= 5 ? 'Stock faible' : 'En stock');
            const hasImage = p.image_url && p.image_url.trim() !== '';
            const card = document.createElement('div');
            card.className = 'product-card';
            card.style.animationDelay = (index * 0.02) + 's';

            // Image avec zoom
            let imgHtml = '';
            if (hasImage) {
                imgHtml = `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name)}" 
                               data-zoom="${escapeHtml(p.image_url)}" 
                               onmouseenter="initZoom(this)" onmousemove="moveZoom(event)" onmouseleave="hideZoom()">`;
            } else {
                imgHtml = `<i class="bi bi-box-seam"></i>`;
            }

            card.innerHTML = `
                <div class="product-img">
                    ${imgHtml}
                    <div class="zoom-lens" id="zoomLens"></div>
                </div>
                <div class="card-body">
                    <div class="product-name">${escapeHtml(p.name)}</div>
                    <div class="product-desc">${escapeHtml(p.description || '')}</div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="product-price">${formatNumber(p.sell_price)} ${currency}</span>
                        <span class="product-stock ${stockStatus}">${stockLabel}</span>
                    </div>
                    ${p.wholesale_price > 0 ? `<div class="wholesale-badge">Gros x${p.wholesale_quantity}</div>` : ''}
                    <button class="btn-add" data-product-id="${p.id}" ${p.quantity <= 0 ? 'disabled' : ''}>
                        <i class="bi bi-cart-plus"></i> Ajouter
                    </button>
                </div>
            `;
            fragment.appendChild(card);
        });
        grid.appendChild(fragment);

        // Délégation pour les boutons Ajouter
        grid.querySelectorAll('.btn-add').forEach(btn => {
            btn.removeEventListener('click', handleAddClick);
            btn.addEventListener('click', handleAddClick);
        });
    }

    // ================================================================
    //  ZOOM SUR LES IMAGES (lentille)
    // ================================================================
    let zoomLens = null;
    let zoomImg = null;

    function initZoom(img) {
        zoomLens = document.getElementById('zoomLens');
        if (!zoomLens) return;
        zoomImg = img;
        const rect = img.getBoundingClientRect();
        const container = img.closest('.product-img');
        zoomLens.style.width = '100px';
        zoomLens.style.height = '100px';
        zoomLens.style.backgroundImage = `url(${img.dataset.zoom})`;
        zoomLens.style.backgroundSize = `${rect.width * 2}px ${rect.height * 2}px`;
        zoomLens.style.display = 'block';
    }

    function moveZoom(e) {
        if (!zoomLens || !zoomImg) return;
        const rect = zoomImg.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const lensW = zoomLens.offsetWidth;
        const lensH = zoomLens.offsetHeight;
        let left = x - lensW / 2;
        let top = y - lensH / 2;
        if (left < 0) left = 0;
        if (top < 0) top = 0;
        if (left + lensW > rect.width) left = rect.width - lensW;
        if (top + lensH > rect.height) top = rect.height - lensH;
        zoomLens.style.left = left + 'px';
        zoomLens.style.top = top + 'px';
        const bgX = (left / rect.width) * 100;
        const bgY = (top / rect.height) * 100;
        zoomLens.style.backgroundPosition = `${bgX}% ${bgY}%`;
    }

    function hideZoom() {
        if (zoomLens) zoomLens.style.display = 'none';
    }

    // ================================================================
    //  PANIER (avec animation fly-to-cart)
    // ================================================================
    function handleAddClick(e) {
        const btn = e.currentTarget;
        const productId = parseInt(btn.dataset.productId, 10);
        if (productId) addToCart(productId);
    }

    function addToCart(productId) {
        const product = allProducts.find(p => p.id === productId);
        if (!product) { showToast('Erreur: produit non trouvé', 'danger'); return; }
        if (product.quantity <= 0) { showToast('Rupture de stock', 'warning'); return; }

        const existing = cart.find(item => item.product_id === productId);
        if (existing) {
            if (existing.quantity >= product.quantity) { showToast('Stock insuffisant', 'warning'); return; }
            existing.quantity++;
        } else {
            cart.push({
                product_id: product.id,
                name: product.name,
                quantity: 1,
                unit_price: parseFloat(product.sell_price),
                stock: product.quantity
            });
        }

        updateCartUI();
        showToast(`${product.name} ajouté au panier`, 'success');

        // Animation fly-to-cart
        const btn = document.querySelector(`.btn-add[data-product-id="${productId}"]`);
        if (btn) {
            const rect = btn.getBoundingClientRect();
            const fly = document.createElement('div');
            fly.className = 'fly-item';
            fly.textContent = '🛒';
            fly.style.left = rect.left + 'px';
            fly.style.top = rect.top + 'px';
            document.body.appendChild(fly);
            const cartBtn = document.querySelector('.cart-btn');
            const cartRect = cartBtn.getBoundingClientRect();
            const dx = cartRect.left - rect.left + 20;
            const dy = cartRect.top - rect.top - 20;
            requestAnimationFrame(() => {
                fly.style.transform = `translate(${dx}px, ${dy}px) scale(0.2)`;
                fly.style.opacity = '0.5';
            });
            setTimeout(() => {
                fly.remove();
            }, 800);
        }

        openCart();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
        if (cart.length === 0) closeCart();
    }

    function updateCartQty(index, delta) {
        const item = cart[index];
        if (!item) return;
        const newQty = item.quantity + delta;
        if (newQty < 1) return;
        if (newQty > item.stock) { showToast('Stock insuffisant', 'warning'); return; }
        item.quantity = newQty;
        updateCartUI();
    }

    function clearCart() {
        cart = [];
        updateCartUI();
        closeCart();
        showToast('Panier vidé', 'info');
    }

    function updateCartUI() {
        const badge = document.getElementById('cartCount');
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        badge.textContent = totalItems;

        const container = document.getElementById('cartItemsList');
        const totalSpan = document.getElementById('cartTotalModal');

        if (!cart.length) {
            container.innerHTML = '<div class="empty-cart-msg">Votre panier est vide.</div>';
            totalSpan.textContent = '0 FCFA';
            return;
        }

        let html = '';
        let total = 0;
        const currency = shopSettings?.currency || 'FCFA';
        cart.forEach((item, idx) => {
            const lineTotal = item.quantity * item.unit_price;
            total += lineTotal;
            html += `
                <div class="cart-item-row">
                    <span class="item-name">${escapeHtml(item.name)}</span>
                    <div class="item-qty">
                        <button onclick="updateCartQty(${idx}, -1)">−</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateCartQty(${idx}, 1)">+</button>
                    </div>
                    <span class="item-price">${formatNumber(lineTotal)} ${currency}</span>
                    <span class="item-remove" onclick="removeFromCart(${idx})">✕</span>
                </div>
            `;
        });
        container.innerHTML = html;
        totalSpan.textContent = formatNumber(total) + ' ' + currency;
    }

    function openCart() {
        if (cart.length === 0) { showToast('Panier vide', 'warning'); return; }
        document.getElementById('cartOverlay').classList.add('visible');
    }

    function closeCart() {
        document.getElementById('cartOverlay').classList.remove('visible');
    }

    // ================================================================
    //  PASSER COMMANDE
    // ================================================================
    function showCheckout() {
        if (!cart.length) { showToast('Panier vide', 'warning'); return; }
        closeCart();
        const modal = new bootstrap.Modal(document.getElementById('checkoutModal'));
        modal.show();
    }

    async function placeOrder() {
        const name = document.getElementById('customerName').value.trim();
        if (!name) { showToast('Veuillez entrer votre nom', 'warning'); return; }
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shop') || '';
        if (!shopId) { showToast('Identifiant boutique manquant', 'danger'); return; }

        const data = {
            customer_name: name,
            customer_email: document.getElementById('customerEmail').value.trim(),
            customer_phone: document.getElementById('customerPhone').value.trim(),
            customer_address: document.getElementById('customerAddress').value.trim(),
            payment_method: document.getElementById('paymentMethod').value,
            notes: document.getElementById('orderNotes').value.trim(),
            shop: shopId,
            items: cart.map(item => ({ product_id: item.product_id, quantity: item.quantity, unit_price: item.unit_price }))
        };

        try {
            const res = await fetch('/api/public/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const result = await res.json();
            if (!res.ok) throw new Error(result.error || 'Erreur');
            showToast('✅ Commande enregistrée ! En attente de validation.', 'success');
            cart = [];
            updateCartUI();
            bootstrap.Modal.getInstance(document.getElementById('checkoutModal')).hide();
            document.getElementById('checkoutForm').reset();
            closeCart();
        } catch (err) {
            showToast('❌ Erreur: ' + err.message, 'danger');
            console.error(err);
        }
    }

    // ================================================================
    //  UTILITAIRES
    // ================================================================
    function formatNumber(n) { if (n === undefined || n === null || isNaN(n)) return '0'; return Number(n).toLocaleString('fr-FR').replace(/\s/g, ' ').replace(/,/g, ' '); }
    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function showToast(message, type = 'success') {
        const toast = document.getElementById('liveToast');
        document.getElementById('toastBody').textContent = message;
        toast.className = `toast align-items-center text-bg-${type} border-0`;
        const bsToast = new bootstrap.Toast(toast);
        bsToast.show();
    }

    // ================================================================
    //  OBSERVER (Infinite Scroll)
    // ================================================================
    let observer = null;
    function setupInfiniteScroll() {
        const sentinel = document.getElementById('scroll-sentinel');
        if (observer) observer.disconnect();
        observer = new IntersectionObserver((entries) => { if (entries[0].isIntersecting) loadMoreProducts(); }, { rootMargin: '0px 0px 200px 0px' });
        observer.observe(sentinel);
    }

    // ================================================================
    //  INIT
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
        // Délégation pour les boutons "Ajouter" (déjà gérée via handleAddClick)
        const urlParams = new URLSearchParams(window.location.search);
        shopId = urlParams.get('shop') || '';
        console.log('🔍 Shop ID:', shopId);

        Promise.all([loadShopSettings(shopId), loadAllProducts()]).then(() => {
            applyFilterAndReset();
            setupInfiniteScroll();
        });

        cart = [];
        updateCartUI();
        closeCart();
    });
</script>
</body>
</html>
