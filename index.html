<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GestPro | Gestion Professionnelle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="theme-color" content="#2c6e9e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="GestPro">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GestPro">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <style>
        :root {
            --primary: #2c6e9e;
            --primary-dark: #1e4a6e;
            --primary-light: #e8f0fe;
            --secondary: #27ae60;
            --secondary-hover: #1e8449;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg-body: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1a2a3a;
            --text-muted: #6b7a8a;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 1.25rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
        }
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 270px;
            background: var(--card-bg); transition: 0.3s; z-index: 1000;
            box-shadow: 2px 0 20px rgba(0,0,0,0.04);
            border-right: 1px solid rgba(0,0,0,0.04);
            overflow-y: auto;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .sidebar .brand { padding: 24px 24px 16px; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .sidebar .brand h4 { font-weight: 700; color: var(--primary); font-size: 1.4rem; }
        .sidebar .brand h4 i { margin-right: 10px; }
        .sidebar .nav-link {
            color: #5a6b7e; padding: 12px 20px; margin: 4px 14px;
            border-radius: 0.9rem; transition: var(--transition);
            font-weight: 500; display: flex; align-items: center; gap: 14px;
            font-size: 0.9rem;
        }
        .sidebar .nav-link i { font-size: 1.2rem; width: 24px; text-align: center; }
        .sidebar .nav-link:hover { background: var(--primary-light); color: var(--primary); transform: translateX(4px); }
        .sidebar .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(44,110,158,0.3); }
        .sidebar .nav-link.logout { color: var(--danger); }
        .sidebar .nav-link.logout:hover { background: #fde8e8; }
        .sidebar .nav-divider { margin: 12px 20px; border-color: rgba(0,0,0,0.04); }
        .content {
            margin-left: 270px;
            padding: 28px 36px;
            min-height: 100vh;
        }
        .navbar-top {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 28px;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-top h3 { font-weight: 700; font-size: 1.5rem; color: var(--text-main); margin: 0; }
        .navbar-top .user-info { display: flex; align-items: center; gap: 12px; }
        .navbar-top .user-info span { font-weight: 600; }
        .navbar-top .user-info i {
            font-size: 1.8rem; color: var(--primary);
            background: var(--primary-light); padding: 6px; border-radius: 50%;
        }
        .stat-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 1.5rem;
            box-shadow: var(--shadow); transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.04); border-top: 4px solid var(--primary);
            position: relative; overflow: hidden;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .stat-card .stat-icon { font-size: 2rem; color: var(--primary); opacity: 0.6; margin-bottom: 8px; }
        .stat-card h6 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 0.25rem; }
        .stat-card h2 { font-size: 1.8rem; font-weight: 700; margin: 0; color: var(--primary); }
        .stat-card .stat-label { font-size: 0.8rem; color: var(--text-muted); }
        .stat-card .stat-link { color: var(--primary); text-decoration: none; font-size: 0.8rem; font-weight: 500; }
        .stat-card .stat-link:hover { text-decoration: underline; }
        .stat-card.green { border-top-color: var(--secondary); }
        .stat-card.green h2 { color: var(--secondary); }
        .stat-card.orange { border-top-color: var(--warning); }
        .stat-card.orange h2 { color: var(--warning); }
        .stat-card.red { border-top-color: var(--danger); }
        .stat-card.red h2 { color: var(--danger); }
        .table-wrapper {
            background: var(--card-bg); border-radius: var(--radius);
            overflow: auto; box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .table-wrapper .table { margin-bottom: 0; }
        .table thead th {
            background: #f8fafc; color: var(--primary); font-weight: 600;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 14px 16px; border-bottom: 2px solid rgba(0,0,0,0.04);
        }
        .table tbody td { padding: 12px 16px; vertical-align: middle; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 0.85rem; }
        .table tbody tr { transition: var(--transition); }
        .table tbody tr:hover { background: var(--primary-light); }
        .table .badge-status { padding: 4px 14px; border-radius: 2rem; font-size: 0.7rem; font-weight: 600; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .btn { border-radius: 2rem !important; font-weight: 500; padding: 8px 24px !important; transition: var(--transition); font-size: 0.85rem; }
        .btn-primary { background: var(--primary); border: none; color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(44,110,158,0.3); }
        .btn-success { background: var(--secondary); border: none; }
        .btn-success:hover { background: var(--secondary-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(39,174,96,0.3); }
        .btn-danger { background: var(--danger); border: none; }
        .btn-danger:hover { background: #c0392b; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(231,76,60,0.3); }
        .btn-warning { background: var(--warning); border: none; color: white; }
        .btn-warning:hover { background: #d68910; transform: translateY(-2px); }
        .btn-outline-secondary { border-color: #dce1e6; color: var(--text-muted); }
        .btn-outline-secondary:hover { background: #f8fafc; border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 4px 14px !important; font-size: 0.75rem; }

        .sales-layout { display: flex; gap: 20px; height: calc(100vh - 280px); min-height: 500px; }
        .sales-products { flex: 1; overflow-y: auto; padding-right: 10px; }
        .sales-cart {
            width: 420px; min-width: 350px; background: var(--card-bg);
            border-radius: var(--radius); box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04); padding: 16px;
            display: flex; flex-direction: column; max-height: 100%;
        }
        .sales-cart .cart-header { border-bottom: 2px solid var(--primary-light); padding-bottom: 10px; margin-bottom: 10px; flex-shrink: 0; }
        .sales-cart .cart-items { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .sales-cart .cart-items::-webkit-scrollbar { width: 4px; }
        .sales-cart .cart-items::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .sales-cart .cart-footer { border-top: 2px solid var(--primary-light); padding-top: 10px; flex-shrink: 0; }
        .sales-cart .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; padding: 6px 10px; margin-bottom: 4px;
            border-radius: 0.75rem; transition: var(--transition);
            border: 1px solid transparent; font-size: 0.8rem;
        }
        .sales-cart .cart-item:hover { border-color: rgba(44,110,158,0.1); background: var(--primary-light); }
        .cart-item .item-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cart-item .item-qty { display: flex; align-items: center; gap: 4px; margin: 0 8px; }
        .cart-item .item-qty button {
            background: none; border: none; width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--primary); cursor: pointer; transition: var(--transition);
            font-size: 0.7rem;
        }
        .cart-item .item-qty button:hover { background: var(--primary-light); }
        .cart-item .item-qty span { min-width: 20px; text-align: center; font-weight: 600; }
        .cart-item .item-price { font-weight: 600; color: var(--primary); min-width: 70px; text-align: right; font-size: 0.8rem; }
        .cart-item .item-price-edit { margin: 0 6px; }
        .cart-item .item-price-edit input {
            width: 80px !important;
            padding: 2px 6px !important;
            font-size: 0.8rem;
            text-align: center;
            border-radius: 0.5rem !important;
        }
        .cart-item .item-remove { color: var(--danger); cursor: pointer; padding: 0 4px; font-size: 1rem; transition: var(--transition); }
        .cart-item .item-remove:hover { transform: scale(1.2); }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            padding: 4px 2px;
        }
        .product-grid::-webkit-scrollbar { width: 4px; }
        .product-grid::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .product-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 10px 6px;
            text-align: center; cursor: pointer; transition: var(--transition);
            border: 2px solid transparent; box-shadow: var(--shadow);
            position: relative; overflow: hidden;
        }
        .product-card:hover { transform: translateY(-4px) scale(1.02); border-color: var(--primary); box-shadow: var(--shadow-hover); }
        .product-card:active { transform: scale(0.95); }
        .product-card .product-image {
            width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
            margin: 0 auto 4px; background: var(--primary-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: var(--primary); border: 2px solid #e9ecef;
        }
        .product-card .product-image img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .product-card .product-name { font-weight: 600; font-size: 0.75rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-card .product-price { font-weight: 700; color: var(--primary); font-size: 0.8rem; }
        .product-card .product-stock { font-size: 0.6rem; color: var(--text-muted); }
        .product-card .stock-low { color: var(--danger); font-weight: 600; }
        .product-card .badge-stock {
            position: absolute; top: 4px; right: 4px;
            font-size: 0.5rem; padding: 2px 6px; border-radius: 2rem;
        }
        .badge-stock.out-of-stock { background: var(--danger); color: white; }
        .badge-stock.low-stock { background: var(--warning); color: white; }
        .badge-stock.in-stock { background: var(--secondary); color: white; }
        .product-card .wholesale-badge {
            position: absolute; bottom: 4px; left: 4px;
            font-size: 0.5rem; padding: 2px 6px; border-radius: 2rem;
            background: #8e44ad; color: white;
        }
        #validateOrderModal .btn-lg {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            text-align: left;
        }
        #validateOrderModal .btn-lg small {
            font-size: 0.75rem;
            font-weight: normal;
        }
        #validateOrderModal .btn-lg i {
            font-size: 1.5rem;
            vertical-align: middle;
        }
        input, select, textarea {
            border-radius: 2rem !important;
            border: 1px solid #dee2e6 !important;
            padding: 8px 16px !important;
            background: white;
            transition: var(--transition);
            font-size: 0.85rem;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(44,110,158,0.1) !important;
            outline: none;
        }
        .form-label { font-weight: 600; font-size: 0.8rem; color: var(--text-main); margin-bottom: 4px; }
        .card-modern {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 1.25rem; box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04); transition: var(--transition);
        }
        .card-modern:hover { box-shadow: var(--shadow-hover); }
        .card-modern .card-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.75rem; }

        .payment-logos { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .payment-logo {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 2rem;
            font-size: 0.7rem; font-weight: 600; cursor: pointer;
            transition: var(--transition); border: 2px solid transparent;
        }
        .payment-logo:hover { transform: scale(1.05); box-shadow: var(--shadow-hover); }
        .payment-logo.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
        .payment-logo.cash { background: #f1c40f; color: #2c3e50; }
        .payment-logo.wave { background: #2ecc71; color: white; }
        .payment-logo.orange { background: #e67e22; color: white; }
        .payment-logo .logo-icon { font-size: 1rem; }

        .client-suggestion {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border-radius: 1rem;
            box-shadow: var(--shadow-hover); max-height: 200px;
            overflow-y: auto; z-index: 1000;
            border: 1px solid rgba(0,0,0,0.04); margin-top: 4px;
        }
        .client-suggestion div {
            padding: 8px 16px; cursor: pointer; transition: var(--transition);
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .client-suggestion div:hover { background: var(--primary-light); color: var(--primary); }

        .toggle-sidebar {
            display: none; position: fixed; bottom: 24px; right: 24px;
            z-index: 1100; background: var(--primary); border-radius: 60px;
            width: 54px; height: 54px; text-align: center; line-height: 54px;
            color: white; cursor: pointer; box-shadow: 0 8px 30px rgba(44,110,158,0.3);
            font-size: 1.5rem; transition: var(--transition);
        }
        .toggle-sidebar:hover { transform: scale(1.05); }

        @media (max-width: 1200px) { .sales-cart { width: 340px; min-width: 280px; } }
        @media (max-width: 992px) {
            .sales-layout { flex-direction: column; height: auto; }
            .sales-cart { width: 100%; max-height: 500px; min-height: 300px; }
            .sales-products { max-height: 500px; }
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .content { margin-left: 0; padding: 16px; }
            .toggle-sidebar { display: block; }
            .navbar-top { flex-direction: column; gap: 8px; text-align: center; }
            .stat-card h2 { font-size: 1.4rem; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .product-card .product-image { width: 50px; height: 50px; font-size: 1.3rem; }
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeInUp 0.4s ease-out forwards; }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }
        .delay-4 { animation-delay: 0.2s; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .text-primary-custom { color: var(--primary); }
        .bg-primary-light { background: var(--primary-light); }
        .fw-600 { font-weight: 600; }
        .fs-small { font-size: 0.8rem; }
        .text-muted-custom { color: var(--text-muted); }
        @keyframes cartPulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .cart-pulse { animation: cartPulse 0.3s ease-in-out; }
        .barcode-input { position: relative; }
        .barcode-input input { padding-right: 50px !important; }
        .barcode-input .barcode-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem; }
        .barcode-scan-flash { animation: flashGreen 0.5s ease; }
        @keyframes flashGreen { 0% { background-color: rgba(39, 174, 96, 0.3); } 100% { background-color: transparent; } }
        .wholesale-toggle { cursor: pointer; font-size: 0.8rem; }
        .wholesale-toggle.active { color: var(--primary); font-weight: 600; }
        .wholesale-prices { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
        .wholesale-prices span { display: block; }
        .price-normal { color: var(--primary); }
        .price-wholesale { color: #8e44ad; font-weight: 600; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="brand">
        <h4><i class="bi bi-box-seam"></i> GestPro</h4>
        <span class="text-muted-custom fs-small">Gestion professionnelle</span>
    </div>
    <nav class="nav flex-column mt-2">
        <a class="nav-link active" data-page="dashboard"><i class="bi bi-speedometer2" style="color: #2c6e9e;"></i> Tableau de bord</a>
        <a class="nav-link" data-page="products"><i class="bi bi-box-seam" style="color: #27ae60;"></i> Produits</a>
        <a class="nav-link" data-page="sales"><i class="bi bi-cart-plus" style="color: #f39c12;"></i> Ventes</a>
        <a class="nav-link" data-page="proforma"><i class="bi bi-file-text" style="color: #8e44ad;"></i> Proforma</a>
        <a class="nav-link" data-page="invoices"><i class="bi bi-receipt" style="color: #e74c3c;"></i> Factures</a>
        <a class="nav-link" data-page="clients"><i class="bi bi-people" style="color: #3498db;"></i> Clients</a>
        <a class="nav-link" data-page="cash"><i class="bi bi-cash-stack" style="color: #2ecc71;"></i> Caisse</a>
        <a class="nav-link" data-page="inventory"><i class="bi bi-clipboard-data" style="color: #9b59b6;"></i> Inventaire</a>
        <a class="nav-link" data-page="reports"><i class="bi bi-graph-up" style="color: #e67e22;"></i> Rapports</a>
        <a class="nav-link" data-page="settings"><i class="bi bi-gear" style="color: #7f8c8d;"></i> Paramètres</a>
        <a class="nav-link" data-page="history"><i class="bi bi-clock-history" style="color: #1abc9c;"></i> Historique</a>
        <a class="nav-link" data-page="sub-users"><i class="bi bi-people-fill" style="color: #2ecc71;"></i> Équipe</a>
        <a class="nav-link" data-page="drivers"><i class="bi bi-people-fill" style="color: #3498db;"></i> Livreurs</a>
        <a class="nav-link" data-page="deliveries"><i class="bi bi-truck" style="color: #f39c12;"></i> Livraisons</a>
        <a class="nav-link" data-page="orders"><i class="bi bi-bag" style="color: #e67e22;"></i> Commandes en ligne</a>
        <hr class="nav-divider">
        <a class="nav-link logout" id="logoutBtn"><i class="bi bi-box-arrow-right" style="color: #e74c3c;"></i> Déconnexion</a>
    </nav>
</div>

<div class="toggle-sidebar" id="toggleSidebar"><i class="bi bi-list"></i></div>

<div class="content" id="mainContent">
    <div class="navbar-top">
        <h3 id="pageTitle">Tableau de bord</h3>
        <div class="user-info">
            <span id="userName"></span>
            <i class="bi bi-person-circle"></i>
        </div>
    </div>
    <div id="pageContainer">Chargement...</div>
</div>

<!-- Modal de validation de commande -->
<div class="modal fade" id="validateOrderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-check-circle-fill text-primary me-2"></i>Valider la commande</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Commande #<span id="validateOrderId"></span></strong></p>
                <p class="text-muted">Choisissez le mode de paiement :</p>
                <div class="d-grid gap-2">
                    <button class="btn btn-success btn-lg" id="validateImmediate" onclick="confirmValidateOrder(false)">
                        <i class="bi bi-check-circle me-2"></i>Paiement immédiat
                        <small class="d-block text-white-50">La facture sera payée directement</small>
                    </button>
                    <button class="btn btn-warning btn-lg" id="validateDeferred" onclick="confirmValidateOrder(true)">
                        <i class="bi bi-clock me-2"></i>Paiement différé
                        <small class="d-block text-dark">La facture sera impayée (échéance)</small>
                    </button>
                </div>
                <div id="deferredDateGroup" class="mt-3" style="display: none;">
                    <label for="dueDateInput" class="form-label">Date d'échéance</label>
                    <input type="date" id="dueDateInput" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            </div>
        </div>
    </div>

let token = localStorage.getItem('token');
let currentUser = null;
const appCache = {
    products: { data: null, timestamp: 0 },
    clients: { data: null, timestamp: 0 },
    settings: { data: null, timestamp: 0 },
    ttl: 300000
};
async function getCachedData(key, fetchFn) {
    const cached = appCache[key];
    if (cached.data && (Date.now() - cached.timestamp < appCache.ttl)) {
        return cached.data;
    }
    const data = await fetchFn();
    cached.data = data;
    cached.timestamp = Date.now();
    return data;
}
let pendingOrdersCount = 0;
let notificationSound = new Audio('/notification.mp3');
let intervalId = null;
function formatNumber(number) {
    if (number === undefined || number === null || isNaN(number)) return '0';
    const num = parseFloat(number);
    return num.toLocaleString('fr-FR').replace(/\s/g, ' ').replace(/,/g, ' ');
}
async function apiCall(endpoint, method = 'GET', body = null, isDownload = false) {
    try {
        const headers = {
            'Content-Type': 'application/json',
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
        };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        let url = `/api${endpoint}`;
        if (method === 'GET' && !url.includes('_t=')) {
            url += (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
        }
        const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
        if (res.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            token = null;
            currentUser = null;
            showAuthPage();
            throw new Error('Session expirée, veuillez vous reconnecter');
        }
        if (isDownload) {
            const blob = await res.blob();
            if (!res.ok) {
                const text = await blob.text();
                try {
                    const error = JSON.parse(text);
                    throw new Error(error.error || 'Erreur téléchargement');
                } catch(e) {
                    throw new Error('Erreur lors du téléchargement du fichier');
                }
            }
            return blob;
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur serveur');
        return data;
    } catch(err) {
        console.error('API Error:', err);
        throw err;
    }
}

    if (!email || !password) {

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

            throw new Error(data.error || 'Erreur de connexion');
        }
        console.log('✅ Connexion réussie !');

        localStorage.setItem('token', data.token);

                        <i class="bi bi-trash"></i>
                    </button>
                </td>

        `).join('');
        document.querySelectorAll('#editItemsBody .edit-qty, #editItemsBody .edit-price').forEach(input => {
            input.addEventListener('input', recalcEditTotals);
        });
        document.querySelectorAll('#editItemsBody .remove-item').forEach(btn => {

                this.closest('tr').remove();
                recalcEditTotals();

window.recalcEditTotals = function() {
    let subtotal = 0;
    document.querySelectorAll('#editItemsBody tr').forEach(row => {
        const qty = parseInt(row.querySelector('.edit-qty')?.value) || 0;
        const price = parseFloat(row.querySelector('.edit-price')?.value) || 0;
        const total = qty * price;
        const totalCell = row.querySelector('.edit-total');
        if (totalCell) totalCell.innerText = formatNumber(total) + ' FCFA';
        subtotal += total;
    });
    const display = document.getElementById('editSubtotalDisplay');
    if (display) display.innerText = formatNumber(subtotal) + ' FCFA';
};
window.saveSaleModification = async function() {
    const saleId = document.getElementById('editSaleId').dataset.saleId;
    if (!saleId) {
        alert('❌ ID de vente manquant.');
        return;
    }
    const items = [];
    document.querySelectorAll('#editItemsBody tr').forEach(row => {
        const product_id = row.querySelector('.edit-qty')?.dataset.id;
        const quantity = parseInt(row.querySelector('.edit-qty')?.value) || 0;
        const unit_price = parseFloat(row.querySelector('.edit-price')?.value) || 0;
        if (product_id && quantity > 0 && unit_price > 0) {
            items.push({ product_id, quantity, unit_price });
        }
    });
    if (items.length === 0) {
        alert('❌ La vente doit contenir au moins un article.');
        return;
    }
    const clientData = {

        client_email: document.getElementById('editClientEmail').value.trim(),

    };
    const remise_pct = parseFloat(document.getElementById('editRemisePct').value) || 0;
    const acompte = parseFloat(document.getElementById('editAcompte').value) || 0;
    try {
        await apiCall(`/sales/${saleId}/items`, 'PUT', { items });
        await apiCall(`/sales/${saleId}`, 'PUT', {
            remise_pct,
            acompte,
            client_name: clientData.client_name,
            client_email: clientData.client_email,
            client_phone: clientData.client_phone,
            client_address: clientData.client_address
        });

};

    };
    console.log('📄 Chargement de la page:', page);
    if (page === 'dashboard') {
        const permissions = window.currentUser?.permissions || [];
        const isAdmin = window.currentUser?.role === 'admin' || permissions.includes('*');

                        <br><small>Contactez votre administrateur.</small>
                    </div>

        }

    const pageTitle = document.getElementById('pageTitle');
    if (pageTitle) {
        pageTitle.innerText = titles[page] || page;
    }
    let pageContainer = document.getElementById('pageContainer');
    if (!pageContainer) {
        const mainContent = document.getElementById('mainContent');
        if (mainContent) {
            const container = document.createElement('div');
            container.id = 'pageContainer';
            mainContent.appendChild(container);
            pageContainer = container;
        } else {
            console.error('❌ #mainContent introuvable');
            return;
        }

    try {
        if (page === 'dashboard') await renderDashboard();
        else if (page === 'products') await renderProducts();
        else if (page === 'sales') await renderSales();
        else if (page === 'proforma') await renderProforma();
        else if (page === 'invoices') await renderInvoices();
        else if (page === 'clients') await renderClients();
        else if (page === 'cash') await renderCash();
        else if (page === 'inventory') await renderInventory();
        else if (page === 'reports') await renderReports();
        else if (page === 'settings') await renderSettings();
        else if (page === 'history') await renderHistory();
        else if (page === 'sub-users') await renderSubUsers();
        else if (page === 'drivers') await renderDrivers();
        else if (page === 'deliveries') await renderDeliveries();
        else if (page === 'orders') await renderOrders();
        else {
            pageContainer.innerHTML = `<div class="alert alert-warning">Page non trouvée: ${page}</div>`;
        }
    } catch (err) {
        console.error('❌ Erreur loadPage:', err);
        pageContainer.innerHTML = `<div class="alert alert-danger">Erreur: ${err.message}</div>`;
    }
}

        window.searchProducts = async function(lowStock = false, page = 1) {
            const loading = document.getElementById('productsLoading');
            const tbody = document.getElementById('productsTable');
            currentSearch = document.getElementById('searchProduct')?.value || '';
            currentLowStock = lowStock;
            currentPage = page;
            if (loading) loading.style.display = 'block';
            try {
                const q = currentSearch;
                const limit = itemsPerPage;
                const offset = (page - 1) * limit;
                let url = `/products/search?limit=${limit}&offset=${offset}&_t=${Date.now()}`;
                if (q) url += `&q=${encodeURIComponent(q)}`;
                if (lowStock) url += '&lowStock=true';
                const prods = await apiCall(url);
                let countUrl = `/products/count?`;
                if (q) countUrl += `q=${encodeURIComponent(q)}&`;
                if (lowStock) countUrl += 'lowStock=true&';
                const totalRes = await apiCall(countUrl);
                totalProducts = totalRes.count || 0;
                if (!tbody) return;
                if (!prods || prods.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">Aucun produit trouvé</td></tr>';
                    document.getElementById('productsPagination').innerHTML = '';
                    document.getElementById('productsInfo').textContent = '0 produit';
                    if (loading) loading.style.display = 'none';
                    return;
                }
                // Utilisation de globalTaxRate pour la TVA
                tbody.innerHTML = prods.map(p => {
                    const taxDisplay = p.tax_rate !== null ? p.tax_rate + '%' : globalTaxRate + '%';
                    const margin = p.sell_price - p.buy_price;
                    return `
                        <tr class="${p.quantity <= p.reorder_level ? 'table-warning' : ''}">
                            <td>${p.barcode || '-'}</td>
                            <td><strong>${p.name}</strong></td>
                            <td>${p.category_name || '-'}</td>
                            <td>${p.quantity} ${p.unit}</td>
                            <td>${formatNumber(p.price_ht)} ${currency}</td>
                            <td>${formatNumber(p.sell_price)} ${currency}</td>
                            <td>${taxDisplay}</td>
                            <td>${formatNumber(margin)} ${currency}</td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" onclick="editProduct(${p.id})">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

                const totalPages = Math.ceil(totalProducts / itemsPerPage);
                renderPagination(page, totalPages);
                const start = (page - 1) * itemsPerPage + 1;
                const end = Math.min(page * itemsPerPage, totalProducts);
                document.getElementById('productsInfo').textContent =
                    totalProducts > 0 ? `${start} - ${end} sur ${totalProducts} produits` : '0 produit';
            } catch(err) {
                console.error(err);
                if (tbody) tbody.innerHTML = `<tr><td colspan="9" class="text-danger">Erreur : ${err.message}</td></tr>`;
            } finally {
                if (loading) loading.style.display = 'none';
            }
        };

        function renderPagination(currentPage, totalPages) {
            const pagination = document.getElementById('productsPagination');
            if (!pagination) return;
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            let html = '';
            if (currentPage > 1) {
                html += `<li class="page-item">
                    <a class="page-link" href="#" onclick="searchProducts(${currentLowStock}, ${currentPage-1}); return false;">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>`;
            }
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            if (startPage > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="searchProducts(${currentLowStock}, 1); return false;">1</a></li>`;
                if (startPage > 2) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="searchProducts(${currentLowStock}, ${i}); return false;">${i}</a>
                </li>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
                html += `<li class="page-item"><a class="page-link" href="#" onclick="searchProducts(${currentLowStock}, ${totalPages}); return false;">${totalPages}</a></li>`;
            }
            if (currentPage < totalPages) {
                html += `<li class="page-item">
                    <a class="page-link" href="#" onclick="searchProducts(${currentLowStock}, ${currentPage+1}); return false;">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>`;
            }
            pagination.innerHTML = html;
        }

                                           onkeydown="if(event.key==='Enter') addProductByBarcode(this.value)">
                                    <button class="btn btn-sm btn-success" onclick="addSelectedEditProduct()">
                                        <i class="bi bi-plus-circle"></i> Ajouter
                                    </button>
                                </div>
                            </div>
                            <small class="text-muted">Scannez un code-barres ou recherchez un produit, puis cliquez sur <strong>Ajouter</strong>.</small>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-6">
                                <strong>Sous-total :</strong>
                                <span id="editSubtotalDisplay">0 FCFA</span>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Remise (%)</label>
                                <input type="number" id="editRemisePct" class="form-control" step="0.01" value="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Acompte (FCFA)</label>
                                <input type="number" id="editAcompte" class="form-control" step="0.01" value="0">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary" onclick="saveSaleModification()">
                            <i class="bi bi-save me-1"></i>Enregistrer
                        </button>
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    </div>
                </div>
            </div>
        </div>
    `;
    document.getElementById('pageContainer').innerHTML = html;

    window.loadSalesProductsPage = async function(page = 1, search = '') {
        const loading = document.getElementById('salesProductsLoading');
        if (loading) loading.style.display = 'block';
        try {
            const offset = (page - 1) * itemsPerPage;
            let url = `/products/search?limit=${itemsPerPage}&offset=${offset}`;
            if (search) url += `&q=${encodeURIComponent(search)}`;
            const data = await apiCall(url);
            allProducts = data;
            window.allProducts = allProducts;
            currentPage = page;
            currentSearch = search;
            if (!search) {
                const countData = await apiCall(`/products/count`);
                totalProducts = countData.count || 0;
            } else {
                const countData = await apiCall(`/products/count?q=${encodeURIComponent(search)}`);
                totalProducts = countData.count || 0;
            }
            renderProductGrid(allProducts);
            renderSalesPagination(page, Math.ceil(totalProducts / itemsPerPage));
            const start = (page - 1) * itemsPerPage + 1;
            const end = Math.min(page * itemsPerPage, totalProducts);
            const info = document.getElementById('salesProductsInfo');
            if (info) {
                info.textContent = totalProducts > 0 ? `${start} - ${end} sur ${totalProducts}` : '0 produit';
            }
        } catch(err) {
            console.error('Erreur chargement produits:', err);
            showToast('❌ Erreur chargement: ' + err.message, 'danger');
        } finally {
            if (loading) loading.style.display = 'none';
        }
    };

    function renderSalesPagination(currentPage, totalPages) {
        const pagination = document.getElementById('salesProductsPagination');
        if (!pagination) return;
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        let html = '';
        if (currentPage > 1) {
            html += `<li class="page-item">
                <a class="page-link" href="#" onclick="loadSalesProductsPage(${currentPage-1}, '${currentSearch}'); return false;">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>`;
        }
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, currentPage + 2);
        if (startPage > 1) {
            html += `<li class="page-item"><a class="page-link" href="#" onclick="loadSalesProductsPage(1, '${currentSearch}'); return false;">1</a></li>`;
            if (startPage > 2) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }
        for (let i = startPage; i <= endPage; i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadSalesProductsPage(${i}, '${currentSearch}'); return false;">${i}</a>
            </li>`;
        }
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
            html += `<li class="page-item"><a class="page-link" href="#" onclick="loadSalesProductsPage(${totalPages}, '${currentSearch}'); return false;">${totalPages}</a></li>`;
        }
        if (currentPage < totalPages) {
            html += `<li class="page-item">
                <a class="page-link" href="#" onclick="loadSalesProductsPage(${currentPage+1}, '${currentSearch}'); return false;">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>`;
        }
        pagination.innerHTML = html;
    }

    let salesSearchTimeout = null;
    window.debounceFilterProducts = function() {
        if (salesSearchTimeout) clearTimeout(salesSearchTimeout);
        salesSearchTimeout = setTimeout(() => {
            const search = document.getElementById('productSearch')?.value?.trim() || '';
            loadSalesProductsPage(1, search);
        }, 400);
    };

    function renderProductGrid(products) {
        const grid = document.getElementById('productGrid');
        if (!grid) return;
        if (!products || products.length === 0) {
            grid.innerHTML = '<div class="text-center text-muted-custom py-4">Aucun produit disponible</div>';
            return;
        }
        grid.innerHTML = products.map(p => {
            const stockStatus = p.quantity <= 0 ? 'out-of-stock' : (p.quantity <= p.reorder_level ? 'low-stock' : 'in-stock');
            const stockLabel = p.quantity <= 0 ? 'Rupture' : (p.quantity <= p.reorder_level ? 'Stock faible' : 'En stock');
            const disabled = p.quantity <= 0 ? 'style="opacity:0.5;cursor:not-allowed;"' : '';
            const hasImage = p.image_url && p.image_url.startsWith('data:image');
            const useWholesale = isWholesaleMode && p.wholesale_price > 0;
            const displayPrice = useWholesale ? p.wholesale_price : p.sell_price;
            return `
                <div class="product-card" onclick="${p.quantity > 0 ? `addProductToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.sell_price}, ${p.quantity}, ${p.wholesale_price || 0}, ${p.wholesale_quantity || 0})` : ''}" ${disabled}>
                    <span class="badge-stock ${stockStatus}">${stockLabel}</span>
                    ${p.wholesale_price > 0 ? '<span class="wholesale-badge">Gros</span>' : ''}
                    <div class="product-image">
                        ${hasImage ? `<img src="${p.image_url}" alt="${p.name}">` : `<i class="bi bi-box-seam"></i>`}
                    </div>
                    <div class="product-name" title="${p.name}">${p.name}</div>
                    <div class="product-price ${useWholesale ? 'price-wholesale' : 'price-normal'}">${formatNumber(displayPrice)} FCFA</div>
                    ${useWholesale ? `<div class="wholesale-prices"><span class="price-wholesale">(x${p.wholesale_quantity})</span></div>` : ''}
                    <div class="product-stock ${p.quantity <= p.reorder_level ? 'stock-low' : ''}">${p.quantity} ${p.unit}</div>
                </div>
            `;
        }).join('');
    }

    window.toggleWholesaleMode = function() {
        const checkbox = document.getElementById('wholesaleToggle');
        isWholesaleMode = checkbox.checked;
        const label = document.getElementById('wholesaleLabel');
        const info = document.getElementById('wholesaleInfo');
        if (isWholesaleMode) {
            label.innerHTML = '📦 Vente en gros ✅';
            info.innerHTML = 'Mode gros: prix réduit (à partir de 5 unités)';
            info.style.color = '#8e44ad';
        } else {
            label.innerHTML = '📦 Vente en gros';
            info.innerHTML = 'Mode normal: prix unitaire';
            info.style.color = 'var(--text-muted)';
        }
        loadSalesProductsPage(currentPage, currentSearch);
    };

    const barcodeInput = document.getElementById('barcodeScan');
    if (barcodeInput) {
        barcodeInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const code = barcodeInput.value.trim();
                if (code.length === 0) return;
                try {
                    const prod = await apiCall(`/products/barcode/${encodeURIComponent(code)}`);
                    addProductToCart(prod.id, prod.name, prod.sell_price, prod.quantity, prod.wholesale_price, prod.wholesale_quantity);
                    barcodeInput.classList.add('barcode-scan-flash');
                    setTimeout(() => barcodeInput.classList.remove('barcode-scan-flash'), 500);
                    barcodeInput.value = '';
                    document.getElementById('productSearch').value = prod.name;
                    loadSalesProductsPage(1, prod.name);
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        oscillator.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        oscillator.frequency.value = 880;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.1;
                        oscillator.start();
                        setTimeout(() => oscillator.stop(), 100);
                    } catch(e) {}
                } catch(err) {
                    showToast('❌ Produit non trouvé avec ce code-barres', 'danger');
                    barcodeInput.classList.add('barcode-scan-flash');
                    setTimeout(() => barcodeInput.classList.remove('barcode-scan-flash'), 500);
                    barcodeInput.value = '';
                }
            }
        });
        barcodeInput.focus();
    }

    window.addProductToCart = (productId, productName, sellPrice, stock, wholesalePrice = 0, wholesaleQty = 5) => {
        const existing = cart.find(i => i.product_id === productId);
        const useWholesale = isWholesaleMode && wholesalePrice > 0;
        const unitPrice = useWholesale ? wholesalePrice : sellPrice;
        if (existing) {
            let maxQty = stock;
            if (useWholesale) {
                maxQty = Math.floor(stock / wholesaleQty) * wholesaleQty;
                if (existing.quantity >= maxQty) {
                    showToast(`Stock insuffisant (${maxQty} disponibles en lots de ${wholesaleQty})`, 'warning');
                    return;
                }
                existing.quantity += wholesaleQty;
                existing.total_price = existing.quantity * existing.unit_price;
            } else {
                if (existing.quantity >= stock) {
                    showToast(`Stock insuffisant (${stock} disponible)`, 'warning');
                    return;
                }
                existing.quantity += 1;
                existing.total_price = existing.quantity * existing.unit_price;
            }
        } else {
            let qty = useWholesale ? wholesaleQty : 1;
            if (qty > stock) {
                showToast(`Stock insuffisant (${stock} disponible)`, 'warning');
                return;
            }
            cart.push({
                product_id: productId,
                name: productName,
                quantity: qty,
                unit_price: unitPrice,
                total_price: qty * unitPrice,
                stock: stock,
                isWholesale: useWholesale
            });
        }
        renderCart();
        loadSalesList();
        const cartContainer = document.getElementById('cartList');
        if (cartContainer) cartContainer.classList.add('cart-pulse');
        setTimeout(() => { if (cartContainer) cartContainer.classList.remove('cart-pulse'); }, 300);
    };

    window.selectPayment = function(method) {
        document.querySelectorAll('.payment-logo').forEach(el => el.classList.remove('active'));
        const el = document.getElementById('pay-' + method);
        if (el) el.classList.add('active');
        document.getElementById('paymentMethod').value = method;
    };

    const clientInput = document.getElementById('clientInput');
    const clientSuggestions = document.getElementById('clientSuggestions');
    let selectedClient = null;
    clientInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        if (term.length < 2) { clientSuggestions.style.display = 'none'; return; }
        const filtered = clientsList.filter(c => c.name.toLowerCase().includes(term));
        if (!filtered.length) { clientSuggestions.style.display = 'none'; return; }
        clientSuggestions.innerHTML = filtered.map(c => `<div data-id="${c.id}" data-name="${c.name}" data-email="${c.email||''}" data-phone="${c.phone||''}" data-address="${c.address||''}">${c.name}</div>`).join('');
        clientSuggestions.style.display = 'block';
        document.querySelectorAll('#clientSuggestions div').forEach(el => { el.addEventListener('click', () => { selectedClient = { id: parseInt(el.dataset.id), name: el.dataset.name, email: el.dataset.email, phone: el.dataset.phone, address: el.dataset.address }; clientInput.value = el.dataset.name; clientSuggestions.style.display = 'none'; }); });
    });
    document.addEventListener('click', (e) => { if (!clientInput.contains(e.target) && !clientSuggestions.contains(e.target)) clientSuggestions.style.display = 'none'; });

    const deferredCheck = document.getElementById('deferredPayment');
    const deferredFields = document.getElementById('deferredFields');
    if (deferredCheck && deferredFields) {
        deferredCheck.addEventListener('change', () => deferredFields.style.display = deferredCheck.checked ? 'block' : 'none');
    }

    window.renderCart = () => {
        const container = document.getElementById('cartList');
        const countEl = document.getElementById('cartCount');
        let total = 0;
        if (!cart.length) {
            container.innerHTML = '<div class="text-center text-muted-custom py-4"><i class="bi bi-cart" style="font-size:2rem;"></i><p class="mb-0">Panier vide</p></div>';
            document.getElementById('cartTotal').innerText = '0 FCFA';
            if (countEl) countEl.innerText = '0';
            return;
        }
        container.innerHTML = cart.map((item, idx) => {
            total += item.total_price;
            return `
                <div class="cart-item">
                    <span class="item-name">${item.name}</span>
                    <div class="item-qty">
                        <button onclick="updateQty(${idx}, -1)"><i class="bi bi-dash"></i></button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQty(${idx}, 1)"><i class="bi bi-plus"></i></button>
                    </div>
                    <div class="item-price-edit">
                        <input type="number" class="form-control form-control-sm" style="width:80px;display:inline-block;"
                               value="${item.unit_price}" step="10" min="0"
                               onchange="updateUnitPrice(${idx}, this.value)">
                    </div>
                    <span class="item-price">${formatNumber(item.total_price)}</span>
                    <span class="item-remove" onclick="removeFromCart(${idx})"><i class="bi bi-x-circle"></i></span>
                </div>
            `;
        }).join('');
        document.getElementById('cartTotal').innerText = formatNumber(total) + ' FCFA';
        if (countEl) countEl.innerText = cart.length;
    };

    window.updateQty = (idx, delta) => {
        const item = cart[idx];
        const newQty = item.quantity + delta;
        if (newQty < 1) return;
        if (newQty > item.stock) return showToast('Stock insuffisant', 'warning');
        item.quantity = newQty;
        item.total_price = item.quantity * item.unit_price;
        renderCart();
    };

    window.updateUnitPrice = (idx, newPrice) => {
        const price = parseFloat(newPrice);
        if (isNaN(price) || price < 0) {
            showToast('Prix invalide', 'danger');
            return;
        }
        cart[idx].unit_price = price;
        cart[idx].total_price = price * cart[idx].quantity;
        renderCart();
    };

    window.removeFromCart = (idx) => {
        cart.splice(idx, 1);
        renderCart();
    };

    window.completeSale = async () => {
        if (cart.length === 0) return showToast('Panier vide', 'warning');
        const clientName = clientInput.value.trim();
        let clientData = {};
        if (selectedClient) {
            clientData = {
                client_name: selectedClient.name,
                client_email: selectedClient.email || '',
                client_phone: selectedClient.phone || '',
                client_address: selectedClient.address || ''
            };
        } else if (clientName !== '') {
            clientData = {
                client_name: clientName,
                client_email: '',
                client_phone: '',
                client_address: ''
            };
        }
        const remise_pct = parseFloat(document.getElementById('remise_pct').value) || 0;
        const acompte = parseFloat(document.getElementById('acompte').value) || 0;
        const payment_method = document.getElementById('paymentMethod').value || 'cash';
        const isDeferred = document.getElementById('deferredPayment').checked;
        const due_date = isDeferred ? document.getElementById('dueDate').value : null;
        const status = isDeferred ? 'pending' : 'completed';
        const items = cart.map(i => ({
            product_id: i.product_id,
            quantity: i.quantity,
            unit_price: i.unit_price
        }));
        const requestData = {
            ...clientData,
            items: items,
            remise_pct: remise_pct,
            acompte: acompte,
            payment_method: payment_method,
            status: status,
            due_date: due_date,
            is_wholesale: isWholesaleMode
        };
        try {
            const result = await apiCall('/sales', 'POST', requestData);
            showToast(`✅ Vente enregistrée (N° ${result.sale_id}) - ${status === 'pending' ? 'Facture en attente' : 'Payée'}`, 'success');
            if (!isDeferred && confirm('📄 Télécharger la facture ?')) {
                try {
                    const blob = await apiCall(`/sales/${result.sale_id}/invoice`, 'GET', null, true);
                    downloadFile(blob, `facture_${result.sale_id}.pdf`);
                } catch(err) {
                    showToast('❌ Erreur téléchargement: ' + err.message, 'danger');
                }
            }
            cart = [];
            renderCart();
            loadSalesList();
            renderDashboard();
            clientInput.value = '';
            selectedClient = null;
            document.getElementById('productSearch').value = '';
            document.getElementById('barcodeScan').value = '';
            document.getElementById('barcodeScan').focus();
            loadSalesProductsPage(1, '');
        } catch(err) {
            console.error('❌ Erreur:', err);
            showToast('❌ Erreur : ' + err.message, 'danger');
        }
    };

    window.loadSalesList = async () => {
        try {
            const sales = await apiCall('/sales');
            renderSalesTable(sales);
        } catch(err) {
            console.error('Erreur chargement ventes:', err);
        }
    };

    function renderSalesTable(sales) {
        const tbody = document.getElementById('salesList');
        if (!tbody) return;
        if (!sales || sales.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Aucune vente trouvée</td></tr>';
            return;
        }
        tbody.innerHTML = sales.slice(0, 50).map(s => {
            const clientName = s.client_name || '-';
            const statusClass = s.status === 'completed' ? 'badge-success' : (s.status === 'pending' ? 'badge-warning' : 'badge-danger');
            const statusLabel = s.status === 'completed' ? '✅ Payée' : (s.status === 'pending' ? '⏳ Impayée' : '❌ Annulée');
            const saleDate = new Date(s.sale_date).toLocaleDateString('fr-FR');
            return `
                <tr>
                    <td><strong>#${s.id}</strong></td>
                    <td>${clientName}</td>
                    <td><strong>${formatNumber(s.final_amount)} FCFA</strong></td>
                    <td><span class="badge-status ${statusClass}">${statusLabel}</span></td>
                    <td>${saleDate}</td>
                    <td>
                        <div class="btn-group btn-group-sm" role="group">
                            <button class="btn btn-info" onclick="downloadInvoice(${s.id})" title="Télécharger la facture">
                                <i class="bi bi-file-pdf"></i>
                            </button>
                            <button class="btn btn-primary" onclick="downloadOrder(${s.id})" title="Télécharger le bon de commande">
                                <i class="bi bi-clipboard-check"></i>
                            </button>
                            <button class="btn btn-secondary" onclick="downloadDelivery(${s.id})" title="Télécharger le bordereau de livraison">
                                <i class="bi bi-truck"></i>
                            </button>
                            <button class="btn btn-warning" onclick="editSale(${s.id})" title="Modifier">
                                <i class="bi bi-pencil"></i>
                            </button>
                            ${s.status !== 'cancelled' ? `
                                <button class="btn btn-sm btn-danger" onclick="cancelSale(${s.id})" title="Annuler la vente">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            ` : ''}
                            ${s.status === 'pending' ? `
                                <button class="btn btn-success" onclick="recordPayment(${s.id})" title="Enregistrer un paiement">
                                    <i class="bi bi-cash"></i>
                                </button>
                            ` : ''}
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // Fonction recordPayment pour les paiements différés
    window.recordPayment = async function(saleId) {
        try {
            const saleData = await apiCall(`/sales/${saleId}`);
            const sale = saleData.sale;
            const totalAmount = sale.final_amount;
            const totalPaid = saleData.payments.reduce((sum, p) => sum + parseFloat(p.amount), 0);
            const remaining = totalAmount - totalPaid;
            if (remaining <= 0) {
                alert('✅ Cette facture est déjà entièrement payée');
                loadSalesList();
                return;
            }
            let amount = parseFloat(prompt(`Montant à payer (max ${formatNumber(remaining)} FCFA) :`, remaining));
            if (isNaN(amount) || amount <= 0) return;
            if (amount > remaining) {
                alert(`Montant trop élevé. Maximum : ${formatNumber(remaining)} FCFA`);
                return;
            }
            const method = prompt('Mode de paiement (cash, wave, orange) :', 'cash');
            if (!method) return;
            const result = await apiCall(`/sales/${saleId}/payment`, 'POST', {
                amount: amount,
                payment_method: method.toLowerCase()
            });
            alert(`✅ Règlement enregistré. Reste à payer : ${formatNumber(result.remaining)} FCFA`);
            loadSalesList();
            if (typeof loadAllInvoices === 'function') loadAllInvoices();
            renderDashboard();
        } catch (err) {
            alert('❌ Erreur : ' + err.message);
            console.error(err);
        }
    };

    window.filterSales = async () => {
        const client = document.getElementById('filterClient')?.value || '';
        const date = document.getElementById('filterDate')?.value || '';
        let url = '/sales?';
        if (client) url += `client_name=${encodeURIComponent(client)}&`;
        if (date) url += `start_date=${date}&end_date=${date}`;
        try {
            const sales = await apiCall(url);
            renderSalesTable(sales);
        } catch(err) {
            showToast('❌ Erreur: ' + err.message, 'danger');
        }
    };

    window.cancelSale = async function(saleId) {
        if (!confirm(`⚠️ Êtes-vous sûr de vouloir annuler définitivement la vente #${saleId} ?\n\nLe stock sera remis et les paiements supprimés.`)) {
            return;
        }
        try {
            await apiCall(`/sales/${saleId}/cancel`, 'PUT');
            showToast(`✅ Vente #${saleId} annulée avec succès`, 'success');
            if (typeof loadSalesList === 'function') loadSalesList();
            if (typeof loadAllInvoices === 'function') loadAllInvoices();
            renderDashboard();
        } catch (err) {
            showToast('❌ Erreur : ' + err.message, 'danger');
            console.error(err);
        }
    };

    // Historique des ventes
    const historyHtml = `
        <div class="card-modern mt-3">
            <h6 class="card-title"><i class="bi bi-clock-history text-primary-custom me-2"></i>Historique ventes</h6>
            <div class="row g-2 mb-3">
                <div class="col-md-5"><input type="text" id="filterClient" class="form-control form-control-sm" placeholder="Filtrer par client"></div>
                <div class="col-md-4"><input type="date" id="filterDate" class="form-control form-control-sm"></div>
                <div class="col-md-3">
                    <button class="btn btn-sm btn-primary w-100" onclick="filterSales()"><i class="bi bi-search"></i> Rechercher</button>
                </div>
            </div>
            <div class="table-wrapper"><table class="table table-sm"><thead><tr><th>#</th><th>Client</th><th>Total</th><th>Statut</th><th>Date</th><th>Actions</th></tr></thead><tbody id="salesList"></tbody></table></div>
        </div>
    `;
    document.getElementById('pageContainer').insertAdjacentHTML('beforeend', historyHtml);

    await loadSalesProductsPage(1, '');
    renderCart();
    loadSalesList();
    setTimeout(() => {
        const scanInput = document.getElementById('barcodeScan');
        if (scanInput) scanInput.focus();
    }, 300);
}

// ========================================================================
// PROFORMA
// ========================================================================
async function renderProforma() {
    let proformas = [];
    const html = `
        <button class="btn btn-primary mb-3" onclick="showProformaModal()"><i class="bi bi-plus-circle me-1"></i>Nouvelle facture proforma</button>

        document.getElementById('proformaItemsList').insertAdjacentHTML('beforeend', itemHtml);
        items.push(idx);
    };
    window.removeProformaItem = (idx) => { document.getElementById(`item-${idx}`)?.remove(); items = items.filter(i => i !== idx); };
    window.saveProforma = async () => {
        const client_name = document.getElementById('proformaClient').value;
        const client_email = document.getElementById('proformaEmail').value;
        const client_phone = document.getElementById('proformaPhone').value;
        const client_address = document.getElementById('proformaAddress').value;

    }
    window.deleteProforma = async (id) => { if(confirm('Supprimer cette proforma ?')) { await apiCall(`/proforma/${id}`, 'DELETE'); loadProformas(); } };

}

async function renderInvoices() {
    let invoices = [];
    const html = `<div class="card-modern"><div class="row g-2 mb-3"><div class="col-md-4"><input type="text" id="searchClientName" class="form-control" placeholder="Nom du client"></div><div class="col-md-4"><input type="date" id="searchDate" class="form-control"></div><div class="col-md-4"><button class="btn btn-primary" onclick="searchInvoices()"><i class="bi bi-search"></i> Rechercher</button> <button class="btn btn-secondary" onclick="loadAllInvoices()"><i class="bi bi-arrow-counterclockwise"></i> Toutes</button></div></div><div id="invoicesList"></div></div>`;
    document.getElementById('pageContainer').innerHTML = html;
    window.searchInvoices = async () => {
        const client = document.getElementById('searchClientName').value;
        const date = document.getElementById('searchDate').value;
        let url = '/sales?status=pending';
        if (client) url += `&client_name=${encodeURIComponent(client)}`;
        if (date) url += `&start_date=${date}&end_date=${date}`;
        invoices = await apiCall(url);
        renderTable(invoices);
    };
    window.loadAllInvoices = async () => { invoices = await apiCall('/sales?status=pending'); renderTable(invoices); };
    window.renderTable = (invoices) => {
        if (invoices.length === 0) {
            document.getElementById('invoicesList').innerHTML = '<div class="alert alert-info">Aucune facture impayée</div>';
            return;
        }
        let html = `<div class="table-wrapper"><table class="table"><thead><tr>
            <th>N°</th><th>Client</th><th>Montant</th><th>Date vente</th><th>Échéance</th><th>Actions</th>
        </tr></thead><tbody>`;
        invoices.forEach(f => {
            html += `<tr>
                <td>#${f.id}</td>
                <td>${f.client_name || 'Client particulier'}</td>
                <td><strong>${formatNumber(f.final_amount)} FCFA</strong></td>
                <td>${new Date(f.sale_date).toLocaleDateString()}</td>
                <td>${f.due_date ? new Date(f.due_date).toLocaleDateString() : '-'}</td>
                <td>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-warning" onclick="recordPaymentInvoice(${f.id})" title="Enregistrer un paiement">
                            <i class="bi bi-cash"></i>
                        </button>
                        <button class="btn btn-info" onclick="downloadInvoice(${f.id})" title="Télécharger la facture">
                            <i class="bi bi-file-pdf"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        });
        html += '</tbody></table></div>';
        document.getElementById('invoicesList').innerHTML = html;
    };
    window.recordPaymentInvoice = async (saleId) => {
        try {
            const saleData = await apiCall(`/sales/${saleId}`);
            const sale = saleData.sale;
            const totalAmount = sale.final_amount;
            const totalPaid = saleData.payments.reduce((sum, p) => sum + parseFloat(p.amount), 0);
            const remaining = totalAmount - totalPaid;
            if (remaining <= 0) {
                alert('✅ Cette facture est déjà entièrement payée');
                searchInvoices();
                return;
            }
            let amount = parseFloat(prompt(`Montant à payer (max ${formatNumber(remaining)} FCFA) :`, remaining));
            if (isNaN(amount) || amount <= 0) return;
            if (amount > remaining) {
                alert(`Montant trop élevé. Maximum: ${formatNumber(remaining)} FCFA`);
                return;
            }
            const method = prompt('Mode de paiement (cash, wave, orange) :', 'cash');
            const result = await apiCall(`/sales/${saleId}/payment`, 'POST', {
                amount: amount,
                payment_method: method || 'cash'
            });
            alert(`✅ Règlement enregistré. Reste à payer : ${formatNumber(result.remaining)} FCFA`);
            searchInvoices();
        } catch(err) { alert('❌ Erreur: ' + err.message); }
    };
    await loadAllInvoices();
}

    const html = `
        <div class="card-modern">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="card-title mb-0"><i class="bi bi-cash-stack text-primary-custom me-2"></i>Gestion de caisse</h5>
                <div><span class="badge ${cashSession.isOpen ? 'badge-success' : 'badge-warning'} p-2">${cashSession.isOpen ? '🟢 Ouverte' : '🔴 Fermée'}</span></div>
            </div>
            <div class="cash-stats mb-4">
                <div class="cash-stat-item"><div class="label">Solde actuel</div><div class="amount green">${formatNumber(summary.balance)} FCFA</div></div>
                <div class="cash-stat-item"><div class="label">Entrées totales</div><div class="amount green">${formatNumber(summary.entries)} FCFA</div></div>
                <div class="cash-stat-item"><div class="label">Sorties totales</div><div class="amount red">${formatNumber(summary.expenses)} FCFA</div></div>
                <div class="cash-stat-item"><div class="label">Session</div><div class="amount">${cashSession.isOpen ? formatNumber(cashSession.openingBalance) + ' FCFA' : '---'}</div></div>
            </div>
            <div class="row g-2 mb-4">
                <div class="col-md-3"><button class="btn btn-success w-100" onclick="openCash()" ${cashSession.isOpen ? 'disabled' : ''}><i class="bi bi-unlock me-1"></i> Ouvrir</button></div>
                <div class="col-md-3"><button class="btn btn-danger w-100" onclick="closeCash()" ${!cashSession.isOpen ? 'disabled' : ''}><i class="bi bi-lock me-1"></i> Fermer</button></div>
                <div class="col-md-3"><button class="btn btn-warning w-100" onclick="addCashTransaction('deposit')"><i class="bi bi-plus-circle me-1"></i> Dépôt</button></div>
                <div class="col-md-3"><button class="btn btn-danger w-100" onclick="addCashTransaction('withdrawal')"><i class="bi bi-dash-circle me-1"></i> Retrait</button></div>
            </div>
            <ul class="nav nav-tabs mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#operations">Opérations</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#balance">Résumé</button></li></ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="operations"><div class="table-wrapper"><table class="table"><thead><tr><th>Type</th><th>Montant</th><th>Description</th><th>Date</th></tr></thead><tbody>${transactions.map(t => `<tr><td><span class="badge ${t.transaction_type==='sale'||t.transaction_type==='deposit'?'badge-success':'badge-danger'}">${t.transaction_type}</span></td><td>${formatNumber(t.amount)} FCFA</td><td>${t.description || ''}</td><td>${new Date(t.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div>
                <div class="tab-pane fade" id="balance"><div class="card p-3"><h6>Résumé de la caisse</h6><table class="table"><tr><th>Entrées totales</th><td>${formatNumber(summary.entries)} FCFA</td></tr><tr><th>Sorties totales</th><td>${formatNumber(summary.expenses)} FCFA</td></tr><tr class="table-success"><th>Solde</th><td><strong>${formatNumber(summary.balance)} FCFA</strong></td></tr>${cashSession.isOpen ? `<tr><th>Fonds de caisse</th><td>${formatNumber(cashSession.openingBalance)} FCFA</td></tr>` : ''}</table></div></div>
            </div>
        </div>
    `;
    document.getElementById('pageContainer').innerHTML = html;
}
window.openCash = () => {
    const amount = parseFloat(prompt('Montant du fonds de caisse initial (FCFA) :', '0'));
    if (isNaN(amount) || amount < 0) return alert('Montant invalide');
    const cashSession = { isOpen: true, openingBalance: amount, openingTime: new Date().toISOString() };
    localStorage.setItem('cashSession', JSON.stringify(cashSession));
    renderCash();
    alert('✅ Caisse ouverte avec ' + formatNumber(amount) + ' FCFA');
};
window.closeCash = async () => {
    const savedSession = localStorage.getItem('cashSession');
    if (!savedSession) return alert('La caisse est déjà fermée');
    const cashSession = JSON.parse(savedSession);
    const summary = await apiCall('/cash-register/summary');
    const diff = summary.balance - cashSession.openingBalance;
    const msg = `📊 Bilan de la caisse\nFonds initial : ${formatNumber(cashSession.openingBalance)} FCFA\nSolde actuel : ${formatNumber(summary.balance)} FCFA\nDifférence : ${diff >= 0 ? '+' : ''}${formatNumber(diff)} FCFA\n\nVoulez-vous fermer la caisse ?`;
    if (confirm(msg)) {
        localStorage.removeItem('cashSession');
        renderCash();
        alert('🔒 Caisse fermée');
    }
};
window.addCashTransaction = async (type) => {
    const savedSession = localStorage.getItem('cashSession');
    if (!savedSession) return alert('⚠️ Veuillez ouvrir la caisse d\'abord');
    const amount = parseFloat(prompt(`Montant (FCFA) pour ${type} :`));
    if (isNaN(amount) || amount <= 0) return alert('Montant invalide');
    const desc = prompt('Description :');
    try {
        await apiCall('/cash-register', 'POST', { transaction_type: type, amount, description: desc });
        renderCash();
        alert('✅ Transaction enregistrée');
    } catch(err) { alert('❌ Erreur : ' + err.message); }
};
