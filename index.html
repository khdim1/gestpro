                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Adresse</label>
                        <input id="companyAddress" class="form-control" value="${settings.company_address || ''}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Téléphone principal</label>
                        <input id="companyPhone" class="form-control" value="${settings.company_phone || ''}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Téléphone secondaire</label>
                        <input id="companyPhone2" class="form-control" value="${settings.company_phone2 || ''}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input id="companyEmail" class="form-control" value="${settings.company_email || ''}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">URL du logo</label>
                        <input id="logoUrl" class="form-control" value="${settings.logo_url || ''}" placeholder="https://exemple.com/logo.png">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Taux TVA (%)</label>
                        <input id="taxRate" class="form-control" value="${settings.tax_rate !== undefined && settings.tax_rate !== null ? settings.tax_rate : 0}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Seuil stock bas</label>
                        <input id="lowStockAlert" class="form-control" value="${settings.low_stock_alert || 5}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Devise</label>
                        <input id="currency" class="form-control" value="${settings.currency || 'FCFA'}">
                    </div>

                    <!-- Cachet et signature -->
                    <div class="col-md-6">
                        <label class="form-label">🖨️ Cachet de l'entreprise</label>
                        <input type="file" id="cachetFile" class="form-control" accept="image/png,image/jpeg" onchange="previewCachet(event)">
                        <div id="cachetPreviewContainer" class="mt-2" style="${settings.cachet_url ? 'display:block;' : 'display:none;'}">
                            <img id="cachetPreview" src="${settings.cachet_url || ''}" alt="Cachet" style="max-width:150px; max-height:80px; border:1px solid #ddd; padding:4px; border-radius:8px;">
                            <button class="btn btn-sm btn-danger ms-2" onclick="removeCachet()"><i class="bi bi-x"></i></button>
                        </div>
                        <input type="hidden" id="cachetUrl" value="${settings.cachet_url || ''}">
                        <small class="text-muted">Format PNG recommandé, fond transparent</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">✍️ Signature</label>
                        <input type="file" id="signatureFile" class="form-control" accept="image/png,image/jpeg" onchange="previewSignature(event)">
                        <div id="signaturePreviewContainer" class="mt-2" style="${settings.signature_url ? 'display:block;' : 'display:none;'}">
                            <img id="signaturePreview" src="${settings.signature_url || ''}" alt="Signature" style="max-width:150px; max-height:80px; border:1px solid #ddd; padding:4px; border-radius:8px;">
                            <button class="btn btn-sm btn-danger ms-2" onclick="removeSignature()"><i class="bi bi-x"></i></button>
                        </div>
                        <input type="hidden" id="signatureUrl" value="${settings.signature_url || ''}">
                        <small class="text-muted">Format PNG recommandé, fond transparent</small>
                    </div>

                    <div class="col-12">
                        <button class="btn btn-primary" id="saveSettingsBtn"><i class="bi bi-save me-1"></i>Enregistrer</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('pageContainer').innerHTML = html;

        window.previewCachet = function(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert('❌ L\'image est trop volumineuse (max 2MB)');
                    event.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    document.getElementById('cachetPreview').src = dataUrl;
                    document.getElementById('cachetPreviewContainer').style.display = 'block';
                    document.getElementById('cachetUrl').value = dataUrl;
                };
                reader.readAsDataURL(file);
            }
        };

        window.previewSignature = function(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    alert('❌ L\'image est trop volumineuse (max 2MB)');
                    event.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    document.getElementById('signaturePreview').src = dataUrl;
                    document.getElementById('signaturePreviewContainer').style.display = 'block';
                    document.getElementById('signatureUrl').value = dataUrl;
                };
                reader.readAsDataURL(file);
            }
        };

        window.removeCachet = function() {
            document.getElementById('cachetPreview').src = '';
            document.getElementById('cachetPreviewContainer').style.display = 'none';
            document.getElementById('cachetUrl').value = '';
            document.getElementById('cachetFile').value = '';
        };

        window.removeSignature = function() {
            document.getElementById('signaturePreview').src = '';
            document.getElementById('signaturePreviewContainer').style.display = 'none';
            document.getElementById('signatureUrl').value = '';
            document.getElementById('signatureFile').value = '';
        };

        window.saveSettings = async function() {
            try {
                const getVal = (id) => {
                    const el = document.getElementById(id);
                    return el ? el.value : '';
                };

                const taxRateValue = getVal('taxRate');
                const taxRate = taxRateValue === '' ? 0 : parseFloat(taxRateValue);

                const data = {
                    company_name: getVal('companyName'),
                    company_subtitle: getVal('companySubtitle'),
                    company_activity: getVal('companyActivity'),
                    company_rc: getVal('companyRc'),
                    company_address: getVal('companyAddress'),
                    company_phone: getVal('companyPhone'),
                    company_phone2: getVal('companyPhone2'),
                    company_email: getVal('companyEmail'),
                    logo_url: getVal('logoUrl'),
                    cachet_url: getVal('cachetUrl'),
                    signature_url: getVal('signatureUrl'),
                    tax_rate: taxRate,
                    low_stock_alert: parseInt(getVal('lowStockAlert')) || 5,
                    currency: getVal('currency') || 'FCFA'
                };

                const result = await apiCall('/settings', 'PUT', data);
                alert('✅ Paramètres mis à jour avec succès');
                renderSettings();
            } catch(err) {
                alert('❌ Erreur : ' + err.message);
                console.error(err);
            }
        };

        const saveBtn = document.getElementById('saveSettingsBtn');
        if (saveBtn) {
            const newBtn = saveBtn.cloneNode(true);
            saveBtn.parentNode.replaceChild(newBtn, saveBtn);
            newBtn.addEventListener('click', window.saveSettings);
        }
    } catch(err) {
        console.error('Erreur renderSettings:', err);
        document.getElementById('pageContainer').innerHTML = `<div class="alert alert-danger">Erreur chargement paramètres : ${err.message}</div>`;
    }
}

async function renderSubUsers() {

            'reports_view': '📊 Voir les rapports',

            'settings_edit': '⚙️ Modifier les paramètres',
            'sub_users_manage': '👥 Gérer l\'équipe'
        };

        const permissionGroups = {
            '📊 Tableau de bord': ['dashboard'],
            '📦 Produits': ['products_view', 'products_create', 'products_edit', 'products_delete'],
            '💰 Ventes': ['sales_view', 'sales_create', 'sales_edit', 'sales_delete'],
            '👤 Clients': ['clients_view', 'clients_create', 'clients_edit', 'clients_delete'],
            '📄 Factures': ['invoices_view', 'invoices_create', 'invoices_pay'],
            '💵 Caisse': ['cash_view', 'cash_manage'],
            '📦 Inventaire': ['inventory_view', 'inventory_manage'],
            '📊 Rapports': ['reports_view'],
            '⚙️ Paramètres': ['settings_view', 'settings_edit'],
            '👥 Équipe': ['sub_users_manage']
        };

        const subUsersWithPerms = await Promise.all(subUsers.map(async (user) => {
            const perms = await apiCall(`/sub-users/${user.id}/permissions`);
            return { ...user, permissions: perms };
        }));

        const html = `
            <div class="card-modern">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div>
                        <h5 class="card-title mb-0"><i class="bi bi-people-fill text-primary-custom me-2"></i>Gestion de l'équipe</h5>
                        <p class="text-muted small mt-1">Créez des comptes pour vos employés et gérez leurs accès</p>
                    </div>
                    <button class="btn btn-primary" onclick="showSubUserModal()">
                        <i class="bi bi-plus-circle me-1"></i> Nouvel employé
                    </button>
                </div>
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Employé</th>
                                <th>Email</th>
                                <th>Statut</th>
                                <th>Accès</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${subUsersWithPerms.length === 0 ? `
                                <tr><td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-people" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
                                    Aucun employé ajouté
                                    <br><small>Cliquez sur "Nouvel employé" pour commencer</small>
                                </td></tr>
                            ` : subUsersWithPerms.map(user => {
                                const userPerms = user.permissions.filter(p => p.has_permission).map(p => p.name);
                                const permLabels = userPerms.map(name => permissionLabels[name] || name);
                                return `
                                <tr>
                                    <td><strong>${user.name}</strong></td>
                                    <td>${user.email}</td>
                                    <td>
                                        <span class="badge ${user.is_active ? 'badge-success' : 'badge-danger'}">
                                            ${user.is_active ? '✅ Actif' : '❌ Inactif'}
                                        </span>
                                    </td>
                                    <td>
                                        ${permLabels.slice(0, 3).map(label => 
                                            `<span class="badge bg-secondary me-1">${label}</span>`
                                        ).join('')}
                                        ${permLabels.length > 3 ? 
                                            `<span class="badge bg-secondary">+${permLabels.length - 3}</span>` : ''}
                                        ${permLabels.length === 0 ? '<span class="text-muted">Aucun accès</span>' : ''}
                                    </td>
                                    <td>${new Date(user.created_at).toLocaleDateString('fr-FR')}</td>
                                    <td>
                                        <button class="btn btn-sm btn-warning me-1" onclick="editSubUser(${user.id})" title="Modifier">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn btn-sm btn-danger" onclick="deleteSubUser(${user.id})" title="Supprimer">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            `}).join('')}
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- MODAL EMPLOYÉ -->
            <div class="modal fade" id="subUserModal" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5><i class="bi bi-person-plus me-2"></i><span id="subUserModalTitle">Nouvel employé</span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="editSubUserId">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label">👤 Nom complet *</label>
                                        <input type="text" id="subUserName" class="form-control" placeholder="Ex: Fatou Diop">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">📧 Email *</label>
                                        <input type="email" id="subUserEmail" class="form-control" placeholder="Ex: fatou@entreprise.com">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">🔒 Mot de passe *</label>
                                        <input type="password" id="subUserPassword" class="form-control" placeholder="Min 6 caractères">
                                        <small class="text-muted">Laisser vide pour ne pas modifier</small>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">📌 Statut</label>
                                        <select id="subUserStatus" class="form-select">
                                            <option value="1">✅ Actif</option>
                                            <option value="0">❌ Inactif</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label">🔑 Permissions d'accès</label>
                                    <div class="card p-2" style="max-height: 400px; overflow-y: auto;">
                                        ${Object.entries(permissionGroups).map(([group, permNames]) => `
                                            <div class="mb-2">
                                                <strong class="text-primary-custom" style="font-size:0.85rem;">${group}</strong>
                                                <div class="row">
                                                    ${permNames.map(permName => {
                                                        const perm = permissions.find(p => p.name === permName);
                                                        if (!perm) return '';
                                                        const label = permissionLabels[permName] || permName;
                                                        return `
                                                            <div class="col-md-6">
                                                                <div class="form-check">
                                                                    <input class="form-check-input" type="checkbox" 
                                                                           id="perm_${perm.id}" value="${perm.id}">
                                                                    <label class="form-check-label small" for="perm_${perm.id}">
                                                                        ${label}
                                                                    </label>
                                                                </div>
                                                            </div>
                                                        `;
                                                    }).join('')}
                                                </div>
                                            </div>
                                            <hr class="my-1">
                                        `).join('')}
                                    </div>
                                    <div class="mt-2 d-flex gap-2">
                                        <button class="btn btn-sm btn-outline-secondary" onclick="selectAllPermissions()">
                                            <i class="bi bi-check-all"></i> Tout sélectionner
                                        </button>
                                        <button class="btn btn-sm btn-outline-secondary" onclick="deselectAllPermissions()">
                                            <i class="bi bi-x"></i> Tout désélectionner
                                        </button>
                                        <button class="btn btn-sm btn-outline-primary" onclick="setDefaultPermissions()">
                                            <i class="bi bi-person"></i> Accès standard
                                        </button>
                                    </div>
                                    <small class="text-muted d-block mt-1">Laissez vide pour donner uniquement l'accès au tableau de bord</small>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                            <button class="btn btn-primary" onclick="saveSubUser()">
                                <i class="bi bi-save me-1"></i>Enregistrer
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('pageContainer').innerHTML = html;
        window.currentPermissions = permissions;
        window.permissionLabels = permissionLabels;

        window.showSubUserModal = function(userId = null) {
            const modal = new bootstrap.Modal(document.getElementById('subUserModal'));
            document.getElementById('subUserModalTitle').innerText = userId ? 'Modifier l\'employé' : 'Nouvel employé';
            document.getElementById('editSubUserId').value = userId || '';

            if (userId) {
                apiCall(`/sub-users/${userId}/permissions`).then(perms => {
                    document.getElementById('subUserPassword').placeholder = 'Laisser vide pour ne pas modifier';
                    document.getElementById('subUserPassword').value = '';
                    perms.forEach(p => {
                        const checkbox = document.getElementById(`perm_${p.id}`);
                        if (checkbox) checkbox.checked = p.has_permission === 1;
                    });
                });
                apiCall('/sub-users').then(users => {
                    const user = users.find(u => u.id === userId);
                    if (user) {
                        document.getElementById('subUserName').value = user.name;
                        document.getElementById('subUserEmail').value = user.email;
                        document.getElementById('subUserStatus').value = user.is_active ? '1' : '0';
                    }
                });
            } else {
                document.getElementById('subUserName').value = '';
                document.getElementById('subUserEmail').value = '';
                document.getElementById('subUserPassword').value = '';
                document.getElementById('subUserPassword').placeholder = 'Min 6 caractères';
                document.getElementById('subUserStatus').value = '1';
                document.querySelectorAll('#subUserModal .form-check-input').forEach(cb => cb.checked = false);
                setTimeout(() => {
                    const defaultPerms = ['dashboard', 'products_view', 'sales_view', 'clients_view', 'invoices_view'];
                    document.querySelectorAll('#subUserModal .form-check-input').forEach(cb => {
                        const perm = window.currentPermissions.find(p => p.id === parseInt(cb.value));
                        if (perm && defaultPerms.includes(perm.name)) {
                            cb.checked = true;
                        }
                    });
                }, 100);
            }
            modal.show();
        };

        window.editSubUser = function(id) {
            showSubUserModal(id);
        };

        window.saveSubUser = async function() {
            try {
                const id = document.getElementById('editSubUserId').value;
                const name = document.getElementById('subUserName').value.trim();
                const email = document.getElementById('subUserEmail').value.trim();
                const password = document.getElementById('subUserPassword').value;
                const is_active = document.getElementById('subUserStatus').value === '1';

                if (!name || !email) return alert('❌ Nom et email sont obligatoires');
                if (!id && (!password || password.length < 6)) return alert('❌ Mot de passe requis (min 6 caractères)');

                const selectedPermissions = [];
                document.querySelectorAll('#subUserModal .form-check-input:checked').forEach(cb => {
                    selectedPermissions.push(parseInt(cb.value));
                });

                const data = { name, email, permissions: selectedPermissions, is_active };
                if (password) data.password = password;

                if (id) {
                    await apiCall(`/sub-users/${id}`, 'PUT', data);
                    alert('✅ Employé modifié avec succès');
                } else {
                    await apiCall('/sub-users', 'POST', data);
                    alert(`✅ Employé créé avec succès !\n\n📧 Email: ${email}\n🔒 Mot de passe: ${password}`);
                }
                bootstrap.Modal.getInstance(document.getElementById('subUserModal')).hide();
                renderSubUsers();
            } catch(err) {
                alert('❌ Erreur: ' + err.message);
            }
        };

        window.deleteSubUser = async function(id) {
            if (!confirm('⚠️ Supprimer définitivement cet employé ?')) return;
            try {
                await apiCall(`/sub-users/${id}`, 'DELETE');
                alert('✅ Employé supprimé');
                renderSubUsers();
            } catch(err) {
                alert('❌ Erreur: ' + err.message);
            }
        };

        window.selectAllPermissions = function() {
            document.querySelectorAll('#subUserModal .form-check-input').forEach(cb => cb.checked = true);
        };

        window.deselectAllPermissions = function() {
            document.querySelectorAll('#subUserModal .form-check-input').forEach(cb => cb.checked = false);
        };

        window.setDefaultPermissions = function() {
            const defaultPerms = ['dashboard', 'products_view', 'sales_view', 'clients_view', 'invoices_view'];
            document.querySelectorAll('#subUserModal .form-check-input').forEach(cb => {
                const perm = window.currentPermissions.find(p => p.id === parseInt(cb.value));
                if (perm && defaultPerms.includes(perm.name)) {
                    cb.checked = true;
                } else {
                    cb.checked = false;
                }
            });
        };
    } catch (err) {
        console.error('Erreur renderSubUsers:', err);
        document.getElementById('pageContainer').innerHTML = `<div class="alert alert-danger">Erreur: ${err.message}</div>`;
    }
}

                    <div class="modal-header"><h5><span id="driverModalTitle">Nouveau livreur</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <input type="hidden" id="editDriverId">
                        <div class="mb-3"><label class="form-label">Nom complet *</label><input type="text" id="driverName" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">Téléphone *</label><input type="text" id="driverPhone" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">Type de véhicule</label><select id="driverVehicle" class="form-select"><option value="moto">Moto</option><option value="voiture">Voiture</option><option value="camionnette">Camionnette</option><option value="vélo">Vélo</option></select></div>
                        <div class="mb-3"><label class="form-label">Plaque d'immatriculation</label><input type="text" id="driverPlate" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">Statut</label><select id="driverStatus" class="form-select"><option value="1">Actif</option><option value="0">Inactif</option></select></div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button><button class="btn btn-primary" onclick="saveDriver()">Enregistrer</button></div>
                </div>
            </div>
        </div>
    `;
    document.getElementById('pageContainer').innerHTML = html;

    window.showDriverModal = function(id = null) {
        document.getElementById('editDriverId').value = id || '';
        document.getElementById('driverName').value = '';
        document.getElementById('driverPhone').value = '';
        document.getElementById('driverVehicle').value = 'moto';
        document.getElementById('driverPlate').value = '';
        document.getElementById('driverStatus').value = '1';
        document.getElementById('driverModalTitle').innerText = id ? 'Modifier livreur' : 'Nouveau livreur';
        if (id) {
            const driver = drivers.find(d => d.id === id);
            if (driver) {
                document.getElementById('driverName').value = driver.name;
                document.getElementById('driverPhone').value = driver.phone;
                document.getElementById('driverVehicle').value = driver.vehicle_type || 'moto';
                document.getElementById('driverPlate').value = driver.license_plate || '';
                document.getElementById('driverStatus').value = driver.is_active ? '1' : '0';
            }
        }
        new bootstrap.Modal(document.getElementById('driverModal')).show();
    };

    window.editDriver = function(id) { showDriverModal(id); };

    window.saveDriver = async function() {
        const id = document.getElementById('editDriverId').value;
        const data = {
            name: document.getElementById('driverName').value.trim(),
            phone: document.getElementById('driverPhone').value.trim(),
            vehicle_type: document.getElementById('driverVehicle').value,
            license_plate: document.getElementById('driverPlate').value.trim() || null,
            is_active: parseInt(document.getElementById('driverStatus').value)
        };
        if (!data.name || !data.phone) return alert('Nom et téléphone requis');
        try {
            if (id) await apiCall(`/delivery/drivers/${id}`, 'PUT', data);
            else await apiCall('/delivery/drivers', 'POST', data);
            alert('✅ Livreur enregistré');
            bootstrap.Modal.getInstance(document.getElementById('driverModal')).hide();
            renderDrivers();
        } catch(err) { alert('❌ Erreur: ' + err.message); }
    };

    window.deleteDriver = async function(id) {
        if (!confirm('Supprimer ce livreur ?')) return;
        try {
            await apiCall(`/delivery/drivers/${id}`, 'DELETE');
            alert('✅ Livreur supprimé');
            renderDrivers();
        } catch(err) { alert('❌ Erreur: ' + err.message); }
    };
}

            <h5><i class="bi bi-truck text-primary-custom me-2"></i>Demandes de livraison</h5>
            <button class="btn btn-primary" onclick="showDeliveryModal()"><i class="bi bi-plus-circle me-1"></i>Nouvelle livraison</button>
        </div>
        <div class="table-wrapper">
            <table class="table">
                <thead><tr><th>#</th><th>Commande</th><th>Client</th><th>Adresse</th><th>Livreur</th><th>Statut</th><th>Code suivi</th><th>Actions</th></tr></thead>
                <tbody>${deliveries.map(d => `
                    <tr>
                        <td>${d.id}</td>
                        <td>#${d.order_id}</td>
                        <td>${d.customer_name}</td>
                        <td>${d.delivery_address}</td>

                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewDelivery(${d.id})"><i class="bi bi-eye"></i></button>
                            <button class="btn btn-sm btn-warning me-1" onclick="editDelivery(${d.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteDelivery(${d.id})"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                `).join('')}</tbody>
            </table>
        </div>
        <div class="modal fade" id="deliveryModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"><h5><span id="deliveryModalTitle">Nouvelle livraison</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <input type="hidden" id="editDeliveryId">
                        <div class="mb-3"><label class="form-label">Commande ID *</label><input type="number" id="deliveryOrderId" class="form-control"></div>
                        <div class="mb-3"><label class="form-label">Adresse de livraison *</label><textarea id="deliveryAddress" class="form-control" rows="2"></textarea></div>
                        <div class="mb-3"><label class="form-label">Livreur</label><select id="deliveryDriver" class="form-select"><option value="">Non assigné</option>${drivers.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}</select></div>
                        <div class="mb-3"><label class="form-label">Statut</label><select id="deliveryStatus" class="form-select"><option value="pending">En attente</option><option value="assigned">Assigné</option><option value="picked_up">Récupéré</option><option value="in_transit">En cours</option><option value="delivered">Livré</option><option value="failed">Échoué</option></select></div>
                        <div class="mb-3"><label class="form-label">Notes</label><textarea id="deliveryNotes" class="form-control" rows="2"></textarea></div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button><button class="btn btn-primary" onclick="saveDelivery()">Enregistrer</button></div>
                </div>
            </div>
        </div>
    `;
    document.getElementById('pageContainer').innerHTML = html;

    window.showDeliveryModal = function(id = null) {
        document.getElementById('editDeliveryId').value = id || '';
        document.getElementById('deliveryOrderId').value = '';
        document.getElementById('deliveryAddress').value = '';
        document.getElementById('deliveryDriver').value = '';
        document.getElementById('deliveryStatus').value = 'pending';
        document.getElementById('deliveryNotes').value = '';
        document.getElementById('deliveryModalTitle').innerText = id ? 'Modifier livraison' : 'Nouvelle livraison';
        if (id) {
            const d = deliveries.find(x => x.id === id);
            if (d) {
                document.getElementById('deliveryOrderId').value = d.order_id;
                document.getElementById('deliveryAddress').value = d.delivery_address;
                document.getElementById('deliveryDriver').value = d.driver_id || '';
                document.getElementById('deliveryStatus').value = d.status || 'pending';
                document.getElementById('deliveryNotes').value = d.notes || '';
            }
        }
        new bootstrap.Modal(document.getElementById('deliveryModal')).show();

    window.editDelivery = function(id) { showDeliveryModal(id); };

    window.saveDelivery = async function() {
        const id = document.getElementById('editDeliveryId').value;
        const order_id = parseInt(document.getElementById('deliveryOrderId').value);
        const delivery_address = document.getElementById('deliveryAddress').value.trim();
        const driver_id = document.getElementById('deliveryDriver').value || null;
        const status = document.getElementById('deliveryStatus').value;
        const notes = document.getElementById('deliveryNotes').value.trim() || null;

        if (!order_id || !delivery_address) return alert('Commande et adresse requis');

        const data = { order_id, delivery_address, notes };
        try {
            if (id) {
                await apiCall(`/delivery/requests/${id}`, 'PUT', { driver_id, status, notes });
            } else {
                await apiCall('/delivery/requests', 'POST', data);

            renderDeliveries();

            alert('✅ Livraison supprimée');
            renderDeliveries();
        } catch(err) { alert('❌ Erreur: ' + err.message); }
    };

    window.viewDelivery = function(id) {
        alert('Détails de la livraison à venir');
    };
}

    try {

        let html = `
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5><i class="bi bi-bag text-primary-custom me-2"></i>Commandes en ligne</h5>

                            <th>Date</th>

                                </td>

                                    <button class="btn btn-sm btn-secondary" onclick="changeOrderStatus(${o.id})"><i class="bi bi-arrow-repeat"></i></button>
                                    <button class="btn btn-sm btn-warning" onclick="editOrder(${o.id})"><i class="bi bi-pencil"></i></button>

                    </tbody>
                </table>
            </div>

        window.viewOrder = async (orderId) => {
            try {
                const data = await apiCall(`/admin/orders/${orderId}`);
                const order = data.order;
                const items = data.items;
                let html = `
                    <div class="modal fade" id="orderModal" tabindex="-1">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5>Commande #${orderId}</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <p><strong>Client:</strong> ${order.customer_name}</p>
                                    <p><strong>Email:</strong> ${order.customer_email || '-'}</p>
                                    <p><strong>Tél:</strong> ${order.customer_phone || '-'}</p>
                                    <p><strong>Adresse:</strong> ${order.customer_address || '-'}</p>
                                    <p><strong>Statut:</strong> <span class="badge ${order.status === 'pending' ? 'badge-warning' : 'badge-success'}">${order.status}</span></p>
                                    <hr>
                                    <h6>Articles</h6>
                                    <table class="table table-sm">
                                        <thead><tr><th>Produit</th><th>Qté</th><th>Prix unit.</th><th>Total</th></tr></thead>
                                        <tbody>
                                            ${items.map(i => `
                                                <tr><td>${i.product_name}</td><td>${i.quantity}</td><td>${formatNumber(i.unit_price)} FCFA</td><td>${formatNumber(i.total_price)} FCFA</td></tr>
                                            `).join('')}
                                        </tbody>
                                        <tfoot><tr><th colspan="3">Total</th><th>${formatNumber(order.total_amount)} FCFA</th></tr></tfoot>
                                    </table>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', html);
                new bootstrap.Modal(document.getElementById('orderModal')).show();
                document.getElementById('orderModal').addEventListener('hidden.bs.modal', function() {
                    this.remove();
                });
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        };

        window.validateOrder = function(orderId) {
            currentOrderId = orderId;
            document.getElementById('validateOrderId').textContent = orderId;
            document.getElementById('deferredDateGroup').style.display = 'none';
            const modal = new bootstrap.Modal(document.getElementById('validateOrderModal'));
            modal.show();
        };

        window.confirmValidateOrder = function(isDeferred) {
            if (isDeferred) {
                document.getElementById('deferredDateGroup').style.display = 'block';
                const deferredBtn = document.getElementById('validateDeferred');
                deferredBtn.innerHTML = '<i class="bi bi-check2 me-2"></i>Confirmer différé';
                deferredBtn.className = 'btn btn-primary btn-lg';
                deferredBtn.onclick = function() {
                    const dueDate = document.getElementById('dueDateInput').value;
                    confirmOrder(currentOrderId, true, dueDate);
                };
                document.getElementById('validateImmediate').disabled = true;
            } else {
                confirmOrder(currentOrderId, false, null);
            }
        };

        async function confirmOrder(orderId, deferred, dueDate) {
            try {
                const result = await apiCall(`/admin/orders/${orderId}/validate`, 'POST', {
                    deferred_payment: deferred,
                    due_date: dueDate || null
                });
                const statusText = deferred ? 'Facture impayée (échéance)' : 'Payée';
                showToast(`✅ Commande #${orderId} validée ! Statut : ${statusText}`, 'success');
                if (result.sale_id) {
                    setTimeout(async () => {
                        if (confirm('📄 Télécharger la facture maintenant ?')) {
                            try {
                                const blob = await apiCall(`/sales/${result.sale_id}/invoice`, 'GET', null, true);
                                downloadFile(blob, `facture_${result.sale_id}.pdf`);
                            } catch(err) {
                                showToast('❌ Erreur: ' + err.message, 'danger');
                            }
                        }
                    }, 500);
                }
                bootstrap.Modal.getInstance(document.getElementById('validateOrderModal')).hide();
                renderOrders();
                renderDashboard();
                if (typeof loadAllInvoices === 'function') loadAllInvoices();
            } catch (err) {
                showToast('❌ Erreur : ' + err.message, 'danger');
                console.error(err);
            }
        }

        window.changeOrderStatus = async (orderId) => {
            const newStatus = prompt('Nouveau statut (pending, confirmed, shipped, delivered, cancelled) :', 'confirmed');
            if (!newStatus) return;
            try {
                await apiCall(`/admin/orders/${orderId}/status`, 'PUT', { status: newStatus });
                alert('✅ Statut mis à jour');
                renderOrders();
            } catch (err) {
                alert('❌ Erreur: ' + err.message);
            }
        };

        window.editOrder = async function(orderId) {
            try {
                const data = await apiCall(`/admin/orders/${orderId}`);
                const order = data.order || {};
                const items = data.items || [];

                if (!items.length) {
                    alert('Cette commande ne contient aucun article.');
                    return;
                }

                if (!window.allProducts) {
                    window.allProducts = await apiCall('/products');
                }

                const modalHtml = `
                    <div class="modal fade" id="editOrderModal" tabindex="-1">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5>Modifier la commande #${orderId}</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <p><strong>Client :</strong> ${order.customer_name || 'Client particulier'}</p>
                                    <p><strong>Date :</strong> ${new Date(order.created_at).toLocaleString()}</p>
                                    <hr>
                                    <div class="table-wrapper">
                                        <table class="table table-sm">
                                            <thead>
                                                <tr>
                                                    <th>Produit</th>
                                                    <th>Quantité</th>
                                                    <th>Prix unit.</th>
                                                    <th>Total</th>
                                                    <th>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody id="editOrderItemsBody">
                                                ${items.map((item, idx) => `
                                                    <tr>
                                                        <td>${item.product_name}</td>
                                                        <td>
                                                            <input type="number" class="form-control form-control-sm edit-order-qty" 
                                                                   value="${item.quantity}" min="1" step="1" data-id="${item.product_id}">
                                                        </td>
                                                        <td>
                                                            <input type="number" class="form-control form-control-sm edit-order-price" 
                                                                   value="${item.unit_price}" min="0" step="10" data-id="${item.product_id}">
                                                        </td>
                                                        <td class="edit-order-total">${formatNumber(item.total_price)} FCFA</td>
                                                        <td>
                                                            <button class="btn btn-sm btn-danger remove-order-item" data-id="${item.product_id}">
                                                                <i class="bi bi-trash"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="mt-2">
                                        <button class="btn btn-sm btn-secondary" onclick="addOrderItemToEdit()">
                                            <i class="bi bi-plus-circle"></i> Ajouter un produit
                                        </button>
                                        <div id="editOrderAddArea" style="display:none; margin-top:10px;">
                                            <div class="row g-2">
                                                <div class="col-5">
                                                    <select id="editOrderProductSelect" class="form-select form-select-sm">
                                                        ${window.allProducts.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                                                    </select>
                                                </div>
                                                <div class="col-2">
                                                    <input type="number" id="editOrderAddQty" class="form-control form-control-sm" value="1" min="1">
                                                </div>
                                                <div class="col-3">
                                                    <input type="number" id="editOrderAddPrice" class="form-control form-control-sm" placeholder="Prix unit." min="0" step="10">
                                                </div>
                                                <div class="col-2">
                                                    <button class="btn btn-sm btn-success" onclick="confirmAddOrderItem()">
                                                        <i class="bi bi-check"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-secondary" onclick="cancelAddOrderItem()">
                                                        <i class="bi bi-x"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mt-2">
                                        <strong>Total :</strong>
                                        <span id="editOrderTotalDisplay">${formatNumber(order.total_amount)} FCFA</span>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button class="btn btn-primary" onclick="saveOrderModification(${orderId})">
                                        <i class="bi bi-save"></i> Enregistrer
                                    </button>
                                    <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const oldModal = document.getElementById('editOrderModal');
                if (oldModal) oldModal.remove();
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                const modal = new bootstrap.Modal(document.getElementById('editOrderModal'));
                modal.show();

                document.querySelectorAll('.edit-order-qty, .edit-order-price').forEach(input => {
                    input.addEventListener('input', recalcOrderTotals);
                });
                document.querySelectorAll('.remove-order-item').forEach(btn => {
                    btn.addEventListener('click', function() {
                        this.closest('tr').remove();
                        recalcOrderTotals();
                    });
                });
                recalcOrderTotals();

                window.addOrderItemToEdit = function() {
                    document.getElementById('editOrderAddArea').style.display = 'block';
                };
                window.cancelAddOrderItem = function() {
                    document.getElementById('editOrderAddArea').style.display = 'none';
                };
                window.confirmAddOrderItem = function() {
                    const productId = document.getElementById('editOrderProductSelect').value;
                    const qty = parseInt(document.getElementById('editOrderAddQty').value) || 1;
                    const price = parseFloat(document.getElementById('editOrderAddPrice').value) || 0;
                    if (!productId || qty <= 0 || price <= 0) {
                        alert('Veuillez remplir tous les champs');
                        return;
                    }
                    const product = window.allProducts?.find(p => p.id == productId);
                    if (!product) {
                        alert('Produit non trouvé');
                        return;
                    }
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${product.name}</td>
                        <td>
                            <input type="number" class="form-control form-control-sm edit-order-qty" 
                                   value="${qty}" min="1" step="1" data-id="${productId}">
                        </td>
                        <td>
                            <input type="number" class="form-control form-control-sm edit-order-price" 
                                   value="${price}" min="0" step="10" data-id="${productId}">
                        </td>
                        <td class="edit-order-total">${formatNumber(qty * price)} FCFA</td>
                        <td>
                            <button class="btn btn-sm btn-danger remove-order-item" data-id="${productId}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    `;
                    document.getElementById('editOrderItemsBody').appendChild(row);
                    row.querySelectorAll('.edit-order-qty, .edit-order-price').forEach(input => {
                        input.addEventListener('input', recalcOrderTotals);
                    });
                    row.querySelector('.remove-order-item').addEventListener('click', function() {
                        this.closest('tr').remove();
                        recalcOrderTotals();
                    });
                    recalcOrderTotals();
                    cancelAddOrderItem();
                };
                window.saveOrderModification = async function(orderId) {
                    const items = [];
                    document.querySelectorAll('#editOrderItemsBody tr').forEach(row => {
                        const product_id = row.querySelector('.edit-order-qty').dataset.id;
                        const quantity = parseInt(row.querySelector('.edit-order-qty').value) || 0;
                        const unit_price = parseFloat(row.querySelector('.edit-order-price').value) || 0;
                        if (product_id && quantity > 0 && unit_price > 0) {
                            items.push({ product_id, quantity, unit_price });
                        }
                    });
                    if (items.length === 0) {
                        alert('La commande doit contenir au moins un article');
                        return;
                    }
                    try {
                        await apiCall(`/admin/orders/${orderId}/items`, 'PUT', { items });
                        alert('✅ Commande modifiée avec succès');
                        bootstrap.Modal.getInstance(document.getElementById('editOrderModal')).hide();
                        renderOrders();
                    } catch (err) {
                        alert('❌ Erreur: ' + err.message);
                        console.error(err);
                    }
                };
                function recalcOrderTotals() {
                    let grandTotal = 0;
                    document.querySelectorAll('#editOrderItemsBody tr').forEach(row => {
                        const qty = parseInt(row.querySelector('.edit-order-qty').value) || 0;
                        const price = parseFloat(row.querySelector('.edit-order-price').value) || 0;
                        const total = qty * price;
                        row.querySelector('.edit-order-total').innerText = formatNumber(total) + ' FCFA';
                        grandTotal += total;
                    });
                    const display = document.getElementById('editOrderTotalDisplay');
                    if (display) display.innerText = formatNumber(grandTotal) + ' FCFA';
                }
            } catch (err) {
                alert('❌ Erreur: ' + err.message);
                console.error(err);
            }
        };
    } catch (err) {
        console.error('Erreur renderOrders:', err);
        document.getElementById('pageContainer').innerHTML = `<div class="alert alert-danger">Erreur: ${err.message}</div>`;
    }
}

function downloadFile(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('✅ PDF téléchargé !', 'success');
    }, 500);
}

// ========================================================================
// NOTIFICATIONS & TOASTS
// ========================================================================
function showToast(message, type = 'success') {
    let toastContainer = document.querySelector('.toast-container');
    if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.className = 'toast-container position-fixed bottom-0 end-0 p-3';
        toastContainer.style.zIndex = '9999';
        document.body.appendChild(toastContainer);
    }
    const toastId = 'toast-' + Date.now();
    const bgClass = type === 'success' ? 'text-bg-success' : 
                    type === 'danger' ? 'text-bg-danger' : 
                    type === 'warning' ? 'text-bg-warning' : 'text-bg-info';
    const toastHtml = `
        <div id="${toastId}" class="toast align-items-center ${bgClass} border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    `;
    toastContainer.insertAdjacentHTML('beforeend', toastHtml);
    const toastElement = document.getElementById(toastId);
    const toast = new bootstrap.Toast(toastElement, { autohide: true, delay: 5000 });
    toast.show();
    toastElement.addEventListener('hidden.bs.toast', function() { this.remove(); });
}

function playNotificationSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.frequency.value = 880;
        oscillator.type = 'sine';
        gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.15);
        setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.frequency.value = 1100;
            osc2.type = 'sine';
            gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc2.start(audioCtx.currentTime);
            osc2.stop(audioCtx.currentTime + 0.1);
        }, 200);
        setTimeout(() => audioCtx.close(), 500);
    } catch (err) { console.log('🔇 Erreur audio:', err.message); }
}

// ========================================================================
// COMMANDES EN LIGNE - NOTIFICATIONS
// ========================================================================
async function updatePendingOrdersBadge() {
    try {
        const data = await apiCall('/admin/orders/pending-count');
        const count = data.count || 0;
        const link = document.querySelector('.sidebar .nav-link[data-page="orders"]');
        if (link) {
            const oldBadge = link.querySelector('.badge');
            if (oldBadge) oldBadge.remove();
            if (count > 0) {
                const badge = document.createElement('span');
                badge.className = 'badge bg-danger ms-2';
                badge.textContent = count;
                link.appendChild(badge);
            }
        }
        if (count > pendingOrdersCount) {
            playNotificationSound();
            showToast(`🛒 ${count - pendingOrdersCount} nouvelle(s) commande(s) en attente !`, 'warning');
            const currentPage = document.querySelector('.sidebar .nav-link.active')?.dataset?.page;
            if (currentPage === 'orders') renderOrders();
            document.title = `🔔 ${count} - GestPro`;
            setTimeout(() => { document.title = 'GestPro | Gestion Professionnelle'; }, 5000);
        }
        pendingOrdersCount = count;
    } catch (err) {
        console.error('Erreur mise à jour badge commandes:', err);
    }
}

function startPendingOrdersCheck() {
    if (intervalId) clearInterval(intervalId);
    updatePendingOrdersBadge();
    intervalId = setInterval(updatePendingOrdersBadge, 30000);
}

function stopPendingOrdersCheck() {
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
}

// ========================================================================
// INIT
// ========================================================================
(async function init() {
    console.log('🚀 Initialisation de l\'application...');
    const storedToken = localStorage.getItem('token');
    const storedUser = localStorage.getItem('user');
    console.log('📌 Token stocké:', storedToken ? 'Oui (longueur: ' + storedToken.length + ')' : 'Non');
    console.log('📌 Utilisateur stocké:', storedUser ? JSON.parse(storedUser) : 'Non');

    if (!storedToken || !storedUser) {
        console.log('🔐 Aucun token trouvé, affichage de la page de connexion');
        showAuthPage();
        return;
    }

    try {
        const user = JSON.parse(storedUser);
        window.currentUser = user;
        window.token = storedToken;
        console.log('🔍 Vérification du token...');
        const response = await fetch('/api/reports/dashboard?_t=' + Date.now(), {
            headers: { 'Authorization': `Bearer ${storedToken}` }
        });
        if (response.ok) {
            console.log('✅ Token valide, chargement de l\'application');
            showApp();
            return;
        } else if (response.status === 401) {
            console.warn('⚠️ Token expiré ou invalide (401)');
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.token = null;
            window.currentUser = null;
        } else {
            console.warn('⚠️ Erreur inattendue:', response.status);
        }
    } catch (e) {
        console.warn('⚠️ Erreur lors de la vérification:', e.message);
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.token = null;
        window.currentUser = null;
    }
    console.log('🔐 Affichage de la page de connexion');
    showAuthPage();
})();

// Activation de l'audio au premier clic
document.addEventListener('click', function initAudio() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    ctx.close();
    document.removeEventListener('click', initAudio);
}, { once: true });
